<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin team &amp; students – SSC Aspirants Official</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/site.css">

<script>try{document.documentElement.dataset.read=localStorage.getItem("ssc-read")==="dark"?"dark":"light";document.documentElement.style.setProperty("--scale",localStorage.getItem("ssc-scale")||1)}catch(e){}</script>
</head>
<body data-page="admin-team" data-title="Admin team &amp; students">
<main id="content" class="content">
<style>
.list{display:grid;gap:10px}
.item{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.item .t{margin-right:auto;min-width:0}
.item .t b{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.item .t span{display:block;font-size:.88rem;color:var(--muted);word-break:break-word}
.mini{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--pri);color:var(--pri-ink);font-weight:700;overflow:hidden}
.mini img{width:100%;height:100%;object-fit:cover}
.btn-sm{min-height:36px;padding:6px 14px;font-size:.9rem}
.fgrid{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end;margin:14px 0}
.fgrid label{display:grid;gap:6px;font-weight:600;font-size:.92rem}
.fgrid input,#uQ{min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:400 16px "Inter",sans-serif;padding:0 12px}
#uQ{width:100%;box-sizing:border-box;margin:10px 0 14px}
.note{background:var(--gold-soft);border-radius:12px;padding:12px 16px;margin:10px 0}
.note code{background:var(--surface);padding:2px 8px;border-radius:6px;font-size:1rem}
.amsg{display:none;border-radius:10px;padding:10px 14px;margin:10px 0}.amsg.show{display:block}.amsg.err{background:#FDECEA;color:#B42318}.amsg.ok{background:#E8F5EC;color:#1E7A3C}
.pill{font-size:.75rem}
@media (max-width:640px){.fgrid{grid-template-columns:1fr}}
</style>
<p><a href="admin.html">← Back to admin panel</a></p>
<section class="card" style="margin-bottom:20px">
  <div class="sec-head"><h2>Admin team</h2><p>Admin accounts are separate from student accounts. They log in at <b>/admin-login</b>.</p></div>
  <div class="amsg" id="tMsg" role="alert"></div>
  <div id="addBox" hidden>
    <div class="fgrid">
      <label>Name<input id="nName" maxlength="60"></label>
      <label>Email<input id="nEmail" type="email" maxlength="120"></label>
      <button class="btn btn-pri" id="nAdd" type="button">Add admin</button>
    </div>
  </div>
  <p class="muted" id="notOwner" hidden>Only the owner can add or remove admins.</p>
  <div class="note" id="tTemp" hidden></div>
  <div class="list" id="tList"><p class="muted">Loading…</p></div>
</section>
<section class="card">
  <div class="sec-head"><h2>Students</h2><p id="uCount">Student accounts</p></div>
  <input id="uQ" type="search" placeholder="Search by name or email" autocomplete="off" aria-label="Search students">
  <div class="note" id="uTemp" hidden></div>
  <div class="list" id="uList"><p class="muted">Loading…</p></div>
</section>
</main>
<script src="data/subjects.js"></script>
<script src="data/exams.js"></script>
<script src="assets/site.js"></script>
<script>
(function () {
  const $ = id => document.getElementById(id), E = SSC.esc;
  const day = t => t ? new Date(t).toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" }) : "–";
  const say = (t, k = "err") => { const m = $("tMsg"); m.textContent = t; m.className = "amsg show " + k; };
  const post = async (url, body) => { const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }); const d = await r.json().catch(() => ({})); if (!r.ok) throw new Error(d.error || "Error " + r.status); return d; };
  let owner = false;
  const tempBox = (el, who, temp, extra) => { el.hidden = false; el.innerHTML = `Password for <b>${E(who)}</b>: <code>${E(temp)}</code><br><small>Send it to them privately. ${extra}</small>`; };

  async function team() {
    try {
      const [me, d] = await Promise.all([fetch("/api/admin/me").then(r => r.json()), fetch("/api/admin/team").then(r => r.json())]);
      owner = !!(me.admin && me.admin.owner); $("addBox").hidden = !owner; $("notOwner").hidden = owner;
      $("tList").innerHTML = d.admins.map(a => `<div class="item"><span class="t"><b>${E(a.name)} ${a.owner ? '<span class="pill ok">Owner</span>' : '<span class="pill">Admin</span>'}</b>
        <span>${E(a.email)} · ${a.owner ? "logs in with ADMIN_PASSWORD" : "added " + day(a.created)} · last login ${day(a.last)}</span></span>
        ${owner && !a.owner ? `<button class="btn btn-out btn-sm" data-act="reset" data-id="${a.id}" data-name="${E(a.name)}">Reset password</button>
        <button class="btn btn-out btn-sm" data-act="remove" data-id="${a.id}" data-name="${E(a.name)}">Remove</button>` : ""}</div>`).join("");
    } catch (e) { $("tList").innerHTML = `<p class="muted">Admin tools work on the live website.</p>`; }
  }
  $("nAdd").addEventListener("click", async () => {
    try { const name = $("nName").value.trim(), d = await post("/api/admin/team", { action: "add", name, email: $("nEmail").value.trim() });
      tempBox($("tTemp"), name, d.temp, "They log in at sscaspirants-official.in/admin-login."); $("nName").value = $("nEmail").value = ""; say("Admin added.", "ok"); team();
    } catch (e) { say(e.message); }
  });
  $("tList").addEventListener("click", async e => {
    const b = e.target.closest("[data-act]"); if (!b) return;
    if (b.dataset.act === "remove" && !confirm("Remove " + b.dataset.name + " from the admin team?")) return;
    if (b.dataset.act === "reset" && !confirm("Reset the password for " + b.dataset.name + "?")) return;
    try { const d = await post("/api/admin/team", { action: b.dataset.act, id: +b.dataset.id });
      if (d.temp) tempBox($("tTemp"), b.dataset.name, d.temp, "Their old password no longer works."); else say("Removed.", "ok"); team();
    } catch (er) { say(er.message); }
  });

  async function students() {
    try {
      const r = await fetch("/api/admin/users?q=" + encodeURIComponent($("uQ").value.trim()), { cache: "no-store" }); const d = await r.json(); if (!r.ok) throw new Error(d.error);
      $("uCount").textContent = `${d.total} students · ${d.week} joined this week`;
      $("uList").innerHTML = d.users.map(u => `<div class="item"><span class="mini">${E(u.name.charAt(0).toUpperCase())}</span><span class="t"><b>${E(u.name)}</b>
        <span>${E(u.email)} · ${u.google ? "Google" : "Email"} · joined ${day(u.created)} · last login ${day(u.last)}</span></span>
        ${u.password ? `<button class="btn btn-out btn-sm" data-reset="${u.id}" data-name="${E(u.name)}">Reset password</button>` : ""}</div>`).join("") || `<p class="muted">No students found.</p>`;
    } catch (e) { $("uList").innerHTML = `<p class="muted">Student list works on the live website.</p>`; }
  }
  $("uList").addEventListener("click", async e => {
    const b = e.target.closest("[data-reset]"); if (!b || !confirm("Reset the password for " + b.dataset.name + "?")) return;
    try { const d = await post("/api/admin/users", { action: "reset", id: +b.dataset.reset }); tempBox($("uTemp"), b.dataset.name, d.temp, "They can change it in Account details after logging in."); }
    catch (er) { alert(er.message); }
  });
  let t; $("uQ").addEventListener("input", () => { clearTimeout(t); t = setTimeout(students, 300); });
  team(); students();
})();
</script>
</body>
</html>
