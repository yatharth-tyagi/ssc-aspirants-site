<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- ssc-build 2/7 dGg= -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My saved questions – SSCAspirants_Official</title>
<meta name="description" content="Mock tests on the latest Eduquity CBT pattern, chapter-wise notes and previous year papers for SSC CGL, CHSL, MTS, GD, CPO and more.">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#141B38"><link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/site.css">

<script>try{document.documentElement.dataset.read=localStorage.getItem("ssc-read")==="dark"?"dark":"light";document.documentElement.style.setProperty("--scale",localStorage.getItem("ssc-scale")||1)}catch(e){}</script>
</head>
<body data-page="saved" data-title="Revision &amp; saved" data-back="account.html">
<main id="content" class="content">
<style>
.sv-top{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.sv-top label{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:.9rem;flex:1 1 220px}
.sv-top select,.sv-top input{min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit;font-size:16px;padding:0 12px}
.sv-count{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.sv-count span{background:var(--pri-soft);color:var(--pri);border-radius:999px;padding:5px 12px;font-weight:600;font-size:.88rem}
.sv-grp{font:700 1.1rem "Poppins",sans-serif;margin:18px 0 8px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline}
.sv-grp span{font:500 .88rem Inter,sans-serif;color:var(--muted)}
.svq{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:10px 0;box-shadow:var(--shadow)}
.svq-h{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.svq-h .n{background:var(--gold-soft);color:#8A6416;font-weight:700;border-radius:8px;padding:3px 10px;font-size:.85rem}
.svq-h .sec{font-size:.85rem;color:var(--muted);margin-right:auto}
.svq-h a,.svq-h button{min-height:34px;padding:0 12px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:600 .84rem Inter,sans-serif;cursor:pointer;display:inline-flex;align-items:center;text-decoration:none}
.svq-h button.rm{color:var(--bad)}
.svq p.qt{margin:0 0 10px;font-weight:600;white-space:pre-line;line-height:1.6}
.svq .ops button{display:block;width:100%;text-align:left;margin:6px 0;min-height:44px;padding:10px 14px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;font:inherit;cursor:pointer}
.svq .ops button.right{border-color:var(--ok);background:var(--ok-soft);color:var(--ok);font-weight:600}
.svq .ops button.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.svq .why{margin-top:8px;border-left:4px solid var(--gold);background:var(--bg);border-radius:8px;padding:8px 12px;white-space:pre-line}
.svq img{display:block;max-width:100%;max-height:340px;border-radius:10px;border:1px solid var(--line);margin:6px 0;background:#fff}
.sv-empty{text-align:center;padding:30px 18px;border:1px dashed var(--line);border-radius:14px;background:var(--surface)}
</style>
<section class="card" data-dyn="1"><div class="sec-head"><h2>My revision list</h2><p>Chapters you added with ☆ on the notes page – revise them before the exam</p></div><div id="revList"><p class="muted">Loading…</p></div></section>
<section class="card"><div class="sec-head"><h2>My saved questions</h2><p>Questions you saved with ☆ in tests and solutions – on every device</p></div>
<div class="sv-top"><label for="sTest">Test<select id="sTest"><option value="">All tests</option></select></label><label for="sFind">Search<input id="sFind" type="search" placeholder="Type a word"></label></div>
<div class="sv-count" id="sCount"></div></section>
<section id="sList" data-dyn="1"><p class="muted">Loading…</p></section>
</main>
<script src="data/subjects.js"></script>
<script src="data/exams.js"></script>
<script src="data/notes.js"></script>
<script src="data/tests.js"></script>
<script src="data/site.js"></script>
<script src="assets/site.js"></script>
<script>
{
const E=SSC.esc,N=window.NOTES||{},S=window.SUBJECTS||[];
const sub=id=>S.find(s=>s.chapters.some(c=>c.id===id));
fetch("/api/me/progress").then(r=>r.ok?r.json():null).then(d=>{const box=document.getElementById("revList");
  const L=((d&&d.progress)||[]).filter(p=>/^R:/.test(p.chapter)&&p.done).map(p=>p.chapter.slice(2)).filter(id=>N[id]);
  box.innerHTML=L.length?`<div style="display:flex;flex-direction:column;gap:8px">${L.map(id=>{const s=sub(id);return `<div class="row"><span class="t"><b>${E(N[id].title)}</b><span>${E(s?s.name:"")}</span></span><a class="btn btn-pri" href="note.html?id=${encodeURIComponent(id)}">Revise</a></div>`;}).join("")}</div>`
    :`<p class="muted" style="margin:0">Nothing here yet. Open any chapter in Notes and press ☆ Add to revision list.</p>`;}).catch(()=>{});
}
</script>
<script>
{
const E=SSC.esc, $=id=>document.getElementById(id), L=k=>String.fromCharCode(65+k);
// the questions of a test (the Indian Polity chapter test is built from the notes, like on the test page)
const testOf=key=>{ if(window.TESTS&&TESTS[key]) return TESTS[key];
  if(key==="polity-ch1-4"){ const s=(window.SUBJECTS||[]).find(x=>x.id==="polity"), qs=[]; if(s) s.chapters.map(c=>c.id).filter(id=>window.NOTES&&NOTES[id]).forEach(id=>(NOTES[id].quiz||[]).forEach(q=>qs.push({...q,section:"Indian Polity",topic:NOTES[id].title})));
    return {title:"Indian Polity – Chapters 1 to 4",questions:qs}; } return null; };
const src=v=>{v=String(v||"").trim(); if(!v) return ""; if(/^https:\/\//i.test(v)) return v; if(/^(assets\/|\/assets\/)/.test(v)) return v.replace(/^\//,""); if(/^[a-z0-9._-]+$/i.test(v)) return "assets/uploads/"+v; return "";};
const pic=(v,alt)=>{const u=src(v); return u?`<img src="${E(u)}" alt="${E(alt||"")}" loading="lazy">`:"";};
let ALL=[];
async function load(){
  try{ const r=await fetch("/api/me/saved"); ALL=r.ok?(await r.json()).saved:[]; }catch(e){ ALL=[]; }
  // also anything saved on this device before saving moved to the account
  try{ const loc=JSON.parse(SSC.store.get("ssc-bm","{}")); Object.entries(loc).forEach(([t,list])=>(list||[]).forEach(q=>{ if(!ALL.some(x=>x.test===t&&x.q===q)) ALL.push({test:t,q,created:0}); })); }catch(e){}
  ALL=ALL.filter(x=>{const t=testOf(x.test); return t&&t.questions[x.q];});
  const tests=[...new Set(ALL.map(x=>x.test))];
  $("sTest").innerHTML=`<option value="">All tests (${ALL.length})</option>`+tests.map(t=>`<option value="${E(t)}">${E(testOf(t).title)} (${ALL.filter(x=>x.test===t).length})</option>`).join("");
  draw();
}
function draw(){
  const ft=$("sTest").value, w=$("sFind").value.trim().toLowerCase();
  const list=ALL.filter(x=>(!ft||x.test===ft)&&(!w||(testOf(x.test).questions[x.q].q+" "+(testOf(x.test).questions[x.q].topic||"")).toLowerCase().includes(w)));
  $("sCount").innerHTML=`<span>${list.length} saved question${list.length===1?"":"s"}</span>`;
  if(!ALL.length){ $("sList").innerHTML=`<div class="sv-empty"><b>No saved questions yet.</b><p class="muted" style="margin:6px 0 0">While giving a test or reading solutions, tap <b>☆ Save</b> on any question. It will show up here.</p></div>`; return; }
  if(!list.length){ $("sList").innerHTML=`<div class="sv-empty">Nothing matches.</div>`; return; }
  const groups={}; list.forEach(x=>(groups[x.test]=groups[x.test]||[]).push(x));
  $("sList").innerHTML=Object.entries(groups).map(([t,xs])=>{ const T=testOf(t);
    return `<h3 class="sv-grp">${E(T.title)} <span>${xs.length} saved</span></h3>`+xs.sort((a,b)=>a.q-b.q).map(x=>{ const q=T.questions[x.q];
      return `<div class="svq" data-t="${E(t)}" data-q="${x.q}"><div class="svq-h"><span class="n">Q ${x.q+1}</span><span class="sec">${E(q.section||"")}${q.topic?" · "+E(q.topic):""}</span>
        <a href="solutions.html?id=${encodeURIComponent(t)}#q=${x.q+1}">Open in solutions</a><button class="rm" type="button" data-rm>✕ Remove</button></div>
        <p class="qt">${E(q.q)}</p>${pic(q.img,"Question picture")}
        <div class="ops">${q.opts.map((o,k)=>`<button type="button" data-o="${k}">${L(k)}. ${E(o)}</button>`).join("")}</div><div class="why" hidden></div></div>`; }).join(""); }).join("");
}
$("sTest").addEventListener("change",draw); $("sFind").addEventListener("input",draw);
$("sList").addEventListener("click",async e=>{
  const card=e.target.closest(".svq"); if(!card) return; const t=card.dataset.t, qi=+card.dataset.q, q=testOf(t).questions[qi];
  const ob=e.target.closest("[data-o]");
  if(ob){ card.querySelectorAll("[data-o]").forEach(b=>{b.disabled=true; if(+b.dataset.o===q.a) b.classList.add("right");}); const good=+ob.dataset.o===q.a; if(!good) ob.classList.add("wrong");
    const w=card.querySelector(".why"); w.hidden=false; w.innerHTML=`<b class="${good?"ok-t":"bad-t"}">${good?"✓ Correct.":"✗ Answer: "+L(q.a)}</b> ${E(q.why||"")}${pic(q.wimg,"Solution")}<div style="margin-top:6px"><button type="button" class="btn btn-out" data-again style="min-height:34px;padding:4px 12px">↻ Try again</button></div>`; return; }
  if(e.target.closest("[data-again]")){ card.querySelectorAll("[data-o]").forEach(b=>{b.disabled=false;b.classList.remove("right","wrong");}); const w=card.querySelector(".why"); w.hidden=true; w.innerHTML=""; return; }
  if(e.target.closest("[data-rm]")){
    ALL=ALL.filter(x=>!(x.test===t&&x.q===qi));
    try{ const loc=JSON.parse(SSC.store.get("ssc-bm","{}")); if(loc[t]){ loc[t]=loc[t].filter(n=>n!==qi); SSC.store.set("ssc-bm",JSON.stringify(loc)); } }catch(er){}
    fetch("/api/me/saved",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({test:t,q:qi,on:false})}).catch(()=>{});
    card.remove(); draw(); }
});
load();
}
</script>
</body>
</html>
