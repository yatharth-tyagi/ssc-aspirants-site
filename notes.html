<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- ssc-build 3/7 YXI= -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SSC Notes – Subject-wise | SSCAspirants_Official</title>
<meta name="description" content="Mock tests on the latest Eduquity CBT pattern, chapter-wise notes and previous year papers for SSC CGL, CHSL, MTS, GD, CPO and more.">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#141B38"><link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/site.css">

<script>try{document.documentElement.dataset.read=localStorage.getItem("ssc-read")==="dark"?"dark":"light";document.documentElement.style.setProperty("--scale",localStorage.getItem("ssc-scale")||1)}catch(e){}</script>
</head>
<body data-page="notes" data-title="Notes">
<main id="content" class="content">
<style>
.notes-wrap{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.subjects{flex:1 1 230px;max-width:280px;display:flex;flex-direction:column;gap:4px}
.subjects button{display:flex;flex-direction:column;align-items:flex-start;text-align:left;border:1px solid transparent;background:transparent;color:var(--ink);padding:10px 14px;border-radius:10px;min-height:44px}
.subjects button span{font-size:.85rem;color:var(--muted)}
.subjects button[aria-pressed="true"]{background:var(--pri);color:var(--pri-ink)}
.subjects button[aria-pressed="true"] span{color:var(--pri-ink);opacity:.85}
.chapters{flex:999 1 520px;display:flex;flex-direction:column;gap:10px}
.cont{display:flex;flex-wrap:wrap;gap:14px;align-items:center;border-radius:18px;padding:16px 20px;color:#fff;background:linear-gradient(135deg,#1F3A93,#141B38);box-shadow:var(--shadow)}
.cont .ci{flex:none;width:48px;height:48px;border-radius:14px;background:#ffffff1f;display:grid;place-items:center;font-size:1.4rem}
.cont .ct{flex:1 1 240px}.cont .ct small{display:block;color:#F5C451;font-weight:700;letter-spacing:.05em;text-transform:uppercase;font-size:.75rem}.cont .ct b{font:700 1.1rem "Poppins",sans-serif}.cont .ct span{display:block;color:#C9D3FF;font-size:.9rem}
.cont .btn{background:#F5C451;color:#141B38;border-color:#F5C451}
.pbar2{height:8px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:6px}.pbar2 i{display:block;height:100%;background:linear-gradient(90deg,#25A386,#0F6B5B);border-radius:6px}
.subjects button .sp{font-size:.75rem;font-weight:700;color:var(--ok)}
.subjects button[aria-pressed="true"] .sp{color:#C8F2E2}
.row.dn .num{background:var(--ok);color:#fff;border-color:var(--ok)}
.donepill{display:inline-flex;align-items:center;gap:4px;font-size:.8rem;font-weight:700;color:var(--ok);background:var(--ok-soft);border-radius:999px;padding:3px 10px;margin-right:6px}
@media(max-width:700px){.subjects{max-width:none;flex-direction:row;overflow-x:auto}.subjects button{flex:none}}
</style>
<section class="cont" id="cont" data-dyn="1" hidden></section>
<section><div class="sec-head"><h2>Chapter-wise notes for SSC</h2><p>Short, exam-ready notes with tricks and a quick check</p></div>
<div class="notes-wrap"><nav class="card subjects" id="subs" aria-label="Subjects"></nav><div class="chapters" id="chaps"></div></div></section>
</main>
<script src="data/subjects.js"></script>
<script src="data/exams.js"></script>
<script src="data/notes.js"></script>
<script src="data/site.js"></script>
<script src="assets/site.js"></script>
<script>
{
const subs=document.getElementById("subs"),chaps=document.getElementById("chaps"),E=SSC.esc;
let cur=(location.hash||"#polity").slice(1); if(!SUBJECTS.some(s=>s.id===cur)) cur="polity";
const ready=c=>!!(window.NOTES&&NOTES[c.id]);
let PR={}; // chapter → {done, seen} from the student's account
const doneIn=s=>s.chapters.filter(c=>ready(c)&&PR[c.id]&&PR[c.id].done).length;
function draw(){
  subs.innerHTML=SUBJECTS.map(s=>{const r=s.chapters.filter(ready).length,d=doneIn(s);return `<button type="button" data-s="${s.id}" aria-pressed="${s.id===cur}">${E(s.name)}<span>${s.hi}</span>${r&&d?`<span class="sp">✓ ${d}/${r} done</span>`:""}</button>`;}).join("");
  const s=SUBJECTS.find(x=>x.id===cur), n=s.chapters.filter(ready).length, d=doneIn(s), pc=n?Math.round(d/n*100):0;
  chaps.innerHTML=`<div class="sec-head" style="margin:0;display:block"><h2>${E(s.name)}</h2><p style="margin:2px 0 0">${n} of ${s.chapters.length} chapters ready${n?` · <b>${d} completed (${pc}%)</b>`:""}</p>${n?`<div class="pbar2" aria-label="${pc}% completed"><i style="width:${pc}%"></i></div>`:""}</div>`+
    s.chapters.map((c,i)=>{const dn=ready(c)&&PR[c.id]&&PR[c.id].done; return `<div class="row${dn?" dn":""}"><span class="num">${dn?"✓":String(i+1).padStart(2,"0")}</span><span class="t"><b>${E(c.title)}</b><span>${E(c.sub)}</span></span>${ready(c)
      ?`${dn?`<span class="donepill">✓ Completed</span>`:""}<a class="btn ${dn?"btn-out":"btn-pri"}" href="note.html?id=${c.id}">${dn?"Read again":PR[c.id]?"Continue":"Read notes"}</a>`:`<span class="pill soon">Coming soon</span>`}</div>`;}).join("");
}
// continue reading: the last chapter opened that is not completed yet
function cont(){
  const all=SUBJECTS.flatMap(s=>s.chapters.filter(ready).map(c=>({s,c})));
  const last=Object.entries(PR).filter(([id,p])=>!p.done&&all.some(x=>x.c.id===id)).sort((a,b)=>b[1].seen-a[1].seen)[0];
  if(!last){document.getElementById("cont").hidden=true;return;}
  const x=all.find(y=>y.c.id===last[0]);
  const box=document.getElementById("cont"); box.hidden=false;
  box.innerHTML=`<span class="ci">📖</span><div class="ct"><small>Continue reading</small><b>${E(x.c.title)}</b><span>${E(x.s.name)} · opened ${new Date(last[1].seen).toLocaleDateString("en-IN",{day:"numeric",month:"short"})}</span></div><a class="btn" href="note.html?id=${x.c.id}">Continue →</a>`;
}
fetch("/api/me/progress").then(r=>r.ok?r.json():null).then(d=>{if(!d)return;PR={};d.progress.forEach(p=>PR[p.chapter]=p);draw();cont();}).catch(()=>{});
subs.addEventListener("click",e=>{const b=e.target.closest("[data-s]");if(!b)return;cur=b.dataset.s;history.replaceState(null,"","#"+cur);draw();});
draw();
}
</script>
</body>
</html>
