<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slide editor – SSCAspirants_Official</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600;700&family=Hind:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/site.css">
<link rel="stylesheet" href="assets/slides.css">
<link rel="stylesheet" href="assets/ribbon.css">
<script>try{document.documentElement.dataset.read=localStorage.getItem("ssc-read")==="dark"?"dark":"light"}catch(e){}</script>
<style>
body{display:flex;flex-direction:column;height:100vh;overflow:hidden;margin:0}
.ebar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 14px;background:var(--side);color:#fff}
.ebar img{width:36px;height:36px;border-radius:50%;border:2px solid #F5C451}
.ebar input{flex:1 1 220px;min-width:0;min-height:38px;border-radius:9px;border:1px solid #ffffff40;background:#ffffff14;color:#fff;font:600 1rem "Poppins",sans-serif;padding:0 12px}
.eb{min-height:38px;padding:0 12px;border-radius:9px;border:1px solid #ffffff40;background:transparent;color:#fff;font:600 .86rem "Inter",sans-serif;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.eb:hover{background:#ffffff1a}
.eb.gold{background:#F5C451;color:#141B38;border-color:#F5C451}
.eb:disabled{opacity:.45}
.estat{font-size:.82rem;color:#C9D3FF;min-width:90px}
.etools{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 14px;background:var(--surface);border-bottom:1px solid var(--line)}
.tbtn{min-height:38px;padding:0 12px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:600 .86rem "Inter",sans-serif;display:inline-flex;align-items:center;gap:6px}
.tbtn:hover{border-color:var(--pri)}
.etools select,.props select,.props input[type=number],.props input[type=text]{min-height:36px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:500 .88rem "Inter",sans-serif;padding:0 8px}
.etools label{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;color:var(--muted)}
input[type=color]{width:38px;height:34px;padding:0;border:1px solid var(--line);border-radius:8px;background:none;cursor:pointer}
body.embed .ebar{display:none}
body.embed .ebody{grid-template-columns:160px minmax(0,1fr) 250px}
body.embed .cwrap{padding:14px}
body.embed #canvas{max-width:none}body.embed .rg.own{display:none}
.rlab{display:flex;align-items:center;gap:6px;font-size:.8rem;font-weight:600;color:var(--ink)}
.ebody{flex:1;display:grid;grid-template-columns:190px minmax(0,1fr) 270px;min-height:0}
.thumbs{overflow:auto;padding:12px 12px 12px 30px;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:12px}
.th{position:relative;cursor:pointer;border-radius:8px;outline:2px solid transparent}
.th.on{outline:3px solid var(--pri);outline-offset:2px}
.th .n{position:absolute;left:-24px;top:2px;background:var(--side);color:#fff;font:700 .7rem Inter;border-radius:6px;padding:1px 6px;z-index:2}
.th .sk-host{border-radius:8px;border:1px solid var(--line);pointer-events:none}
.th .acts{display:flex;gap:4px;justify-content:center;margin-top:4px}
.th .acts button{width:30px;height:28px;border-radius:7px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:.8rem;padding:0}
.addslide{min-height:40px;border-radius:9px;border:2px dashed var(--line);background:transparent;color:var(--pri);font-weight:700}
.cwrap{overflow:auto;padding:22px;display:flex;align-items:flex-start;justify-content:center;background:var(--bg)}
#canvas{width:100%;max-width:1100px;box-shadow:0 8px 30px rgba(20,27,56,.18);border-radius:6px}
#canvas .sk-el{cursor:move}
#canvas .sk-el.editing{cursor:text}
#canvas .sk-el.editing .sk-txt,#canvas td[contenteditable="true"]{outline:2px dashed #C9962E;outline-offset:-2px;cursor:text;user-select:text}
#canvas .sk-wm{opacity:.6}
.selbox{position:absolute;border:2px solid #2F6BFF;pointer-events:none;z-index:1000;box-sizing:border-box}
.selbox i{position:absolute;width:16px;height:16px;background:#fff;border:2px solid #2F6BFF;border-radius:4px;pointer-events:auto;box-sizing:border-box}
.selbox i[data-h=nw]{left:-9px;top:-9px;cursor:nwse-resize}.selbox i[data-h=ne]{right:-9px;top:-9px;cursor:nesw-resize}
.selbox i[data-h=sw]{left:-9px;bottom:-9px;cursor:nesw-resize}.selbox i[data-h=se]{right:-9px;bottom:-9px;cursor:nwse-resize}
.selbox i[data-h=n]{left:calc(50% - 8px);top:-9px;cursor:ns-resize}.selbox i[data-h=s]{left:calc(50% - 8px);bottom:-9px;cursor:ns-resize}
.selbox i[data-h=w]{top:calc(50% - 8px);left:-9px;cursor:ew-resize}.selbox i[data-h=e]{top:calc(50% - 8px);right:-9px;cursor:ew-resize}
.selbox i[data-h=rot]{left:calc(50% - 9px);top:-46px;width:18px;height:18px;border-radius:50%;cursor:grab;background:#2F6BFF}
.selbox i[data-h=rot]::after{content:"";position:absolute;left:6px;top:16px;width:2px;height:22px;background:#2F6BFF}
.selbox.multi{border-style:dashed}.selbox.locked{border-color:#B42318}
.marq{position:absolute;border:1.5px dashed #2F6BFF;background:rgba(47,107,255,.08);z-index:1001;pointer-events:none}
.guide{position:absolute;background:#E5368B;z-index:1002;pointer-events:none}
.notesbox{max-width:1100px;width:100%;margin:12px auto 0}
.notesbox textarea{width:100%;box-sizing:border-box;min-height:70px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:400 .92rem Inter,sans-serif;padding:8px 10px}
.cwrap{flex-direction:column;align-items:center}
.present .pnotes{color:#C9D3FF;max-width:1100px;margin:0 auto;font-size:.95rem;white-space:pre-wrap}
.props{overflow:auto;padding:14px;border-left:1px solid var(--line);background:var(--surface)}
.props h3{font:700 1rem "Poppins",sans-serif;margin:0 0 10px}
.props .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.props label{display:flex;flex-direction:column;gap:4px;font-size:.8rem;font-weight:600;color:var(--muted)}
.props .grp{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.props .grp button{min-width:38px;min-height:36px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-weight:700}
.props .grp button[aria-pressed="true"]{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
.props hr{border:0;border-top:1px solid var(--line);margin:12px 0}
.props .help{font-size:.82rem;color:var(--muted);line-height:1.5}
.props .del{width:100%;min-height:38px;border-radius:9px;border:1px solid #B42318;background:transparent;color:#B42318;font-weight:700}
.banner{display:none;gap:10px;align-items:center;padding:8px 14px;background:var(--gold-soft);font-size:.9rem;flex-wrap:wrap}
.banner.show{display:flex}
dialog{border:1px solid var(--line);border-radius:16px;padding:22px;background:var(--surface);color:var(--ink);max-width:min(520px,calc(100vw - 32px));box-sizing:border-box;width:100%}
dialog::backdrop{background:rgba(10,14,30,.55)}
dialog label{display:flex;flex-direction:column;gap:6px;font-weight:600;margin-bottom:12px}
dialog select,dialog input[type=text]{min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;padding:0 12px}
.ck{flex-direction:row!important;align-items:center;gap:10px!important}
.ck input{width:20px;height:20px}
.present{position:fixed;inset:0;z-index:100;background:#0C1222;padding:16px;display:flex;flex-direction:column;gap:10px;box-sizing:border-box}
.present .sk-view{flex:1;justify-content:center}
.present .sk-screen{width:100%;max-width:calc((100vh - 140px) * 16 / 9);margin:0 auto}
.present .sk-count{color:#fff}
@media(max-width:1000px){.ebody{grid-template-columns:150px minmax(0,1fr)}.props{grid-column:1/-1;border-left:0;border-top:1px solid var(--line);max-height:38vh}}
@media(max-width:700px){body{height:auto;overflow:auto}.ebody{grid-template-columns:1fr}.thumbs{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}.th{flex:0 0 140px}.addslide{flex:0 0 120px}.cwrap{padding:10px}}
</style>
</head>

<script>
(function () {
const $ = id => document.getElementById(id), K = SlideKit, E = SSC.esc;
const qs = new URLSearchParams(location.search);
let deck = null, id = qs.get("id") || "", cur = 0, sel = null, editing = null, dirty = false, published = null;
const hist = [], fut = [];
const DRAFT = () => "ssc-slide-draft:" + (id || "new");
const EMBED = qs.get("embed") === "1";
if (EMBED) document.body.classList.add("embed");
const stat = t => { $("stat").textContent = t; $("rstat").textContent = t; };
Ribbon.tabs($("ribbon"));

// ---------- GitHub (through the site's own server; admins only) ----------
const gh = async (path, opt = {}) => { const r = await fetch("/api/gh" + path, { cache: "no-store", ...opt, headers: { Accept: "application/vnd.github+json", ...(opt.headers || {}) } });
  if (!r.ok) { const t = await r.text(); let m = t; try { m = JSON.parse(t).message || t; } catch (e) {} const er = new Error(r.status + " " + m); er.status = r.status; throw er; } return r; };
const readRaw = async p => { try { return await (await gh(`/contents/${p}?ref=main`, { headers: { Accept: "application/vnd.github.raw+json" } })).text(); } catch (e) { if (e.status === 404) return null; throw e; } };
const shaOf = async p => { try { return (await (await gh(`/contents/${p}?ref=main&meta=1`)).json()).sha; } catch (e) { if (e.status === 404) return null; throw e; } };
const b64 = bytes => { let s = ""; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(s); };
const write = async (p, bytesB64, msg) => { const body = { message: msg, content: bytesB64, branch: "main" }, s = await shaOf(p); if (s) body.sha = s;
  await gh(`/contents/${p}`, { method: "PUT", body: JSON.stringify(body), headers: { "Content-Type": "application/json" } }); };
const writeText = (p, text, msg) => write(p, b64(new TextEncoder().encode(text)), msg);
const readData = async (p, name, fb) => { const code = await readRaw(p); if (code == null) return fb; const w = {}; new Function("window", code)(w); return w[name] === undefined ? fb : w[name]; };
const writeData = (p, name, v, note) => writeText(p, `// ${note}\n// Saved from the admin page on ${new Date().toISOString().slice(0, 10)}.\nwindow.${name} = ${JSON.stringify(v, null, 1)};\n`, "Admin: update " + p);
const slug = t => String(t).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 50) || "slides";

// ---------- history (undo / redo) ----------
const snap = () => JSON.stringify(deck);
function change(fn, keepFut) { hist.push(snap()); if (hist.length > 80) hist.shift(); if (!keepFut) fut.length = 0; fn(); dirty = true; local(); draw(); }
$("undo").onclick = () => { if (!hist.length) return; fut.push(snap()); deck = JSON.parse(hist.pop()); cur = Math.min(cur, deck.slides.length - 1); clearSel(); dirty = true; local(); draw(); };
$("redo").onclick = () => { if (!fut.length) return; hist.push(snap()); deck = JSON.parse(fut.pop()); cur = Math.min(cur, deck.slides.length - 1); clearSel(); dirty = true; local(); draw(); };
const local = () => { try { localStorage.setItem(DRAFT(), JSON.stringify({ at: Date.now(), deck })); } catch (e) {} stat(dirty ? "Not saved" : "Saved"); };

// ---------- selection (one or many boxes) ----------
let sels = [];                                   // selected element ids
const slide = () => deck.slides[cur];
const elById = i => slide().els.find(e => e.id === i);
const selEls = () => sels.map(elById).filter(Boolean);
const clearSel = () => { sels = []; };
Object.defineProperty(window, "__sel", { get: () => sels });
function draw() { drawThumbs(); drawCanvas(); drawProps(); $("title").value = deck.title || ""; $("bg").value = /^#[0-9a-f]{6}$/i.test(slide().bg || "") ? slide().bg : "#ffffff";
  $("undo").disabled = !hist.length; $("redo").disabled = !fut.length; }
function drawThumbs() {
  const t = $("thumbs");
  t.innerHTML = deck.slides.map((s, i) => `<div class="th${i === cur ? " on" : ""}" data-i="${i}" draggable="true"><span class="n">${i + 1}</span><div class="mini"></div>
    <div class="acts"><button type="button" data-a="up" title="Move up" ${i === 0 ? "disabled" : ""}>↑</button><button type="button" data-a="down" title="Move down" ${i === deck.slides.length - 1 ? "disabled" : ""}>↓</button><button type="button" data-a="dup" title="Copy slide">⧉</button><button type="button" data-a="del" title="Delete slide" ${deck.slides.length < 2 ? "disabled" : ""}>🗑</button></div></div>`).join("") +
    `<button class="addslide" type="button" id="plusSlide">＋ Slide</button>`;
  t.querySelectorAll(".mini").forEach((m, i) => { K.render(deck.slides[i], m); K.watch(m); });
  $("plusSlide").onclick = () => addSlide("topic");
}
$("thumbs").addEventListener("click", e => {
  const b = e.target.closest("[data-a]"), th = e.target.closest(".th"); if (!th) return; const i = +th.dataset.i;
  if (!b) { stopEdit(); cur = i; clearSel(); draw(); return; }
  const a = b.dataset.a;
  change(() => {
    const S = deck.slides;
    if (a === "up" && i > 0) { [S[i - 1], S[i]] = [S[i], S[i - 1]]; cur = i - 1; }
    if (a === "down" && i < S.length - 1) { [S[i + 1], S[i]] = [S[i], S[i + 1]]; cur = i + 1; }
    if (a === "dup") { const c = JSON.parse(JSON.stringify(S[i])); c.els.forEach(x => x.id = K.uid()); S.splice(i + 1, 0, c); cur = i + 1; }
    if (a === "del" && S.length > 1) { S.splice(i, 1); cur = Math.min(i, S.length - 1); }
    clearSel();
  });
});
// drag a slide thumbnail to a new place
let dragSlide = null;
$("thumbs").addEventListener("dragstart", e => { const th = e.target.closest(".th"); if (th) dragSlide = +th.dataset.i; });
$("thumbs").addEventListener("dragover", e => { if (dragSlide != null) e.preventDefault(); });
$("thumbs").addEventListener("drop", e => { const th = e.target.closest(".th"); if (dragSlide == null || !th) return; e.preventDefault(); const to = +th.dataset.i, from = dragSlide; dragSlide = null; if (to === from) return;
  change(() => { const [m] = deck.slides.splice(from, 1); deck.slides.splice(to, 0, m); cur = to; clearSel(); }); });

function drawCanvas() {
  const st = K.render(slide(), $("canvas"), { edit: true, wm: true });
  sels = sels.filter(i => elById(i));
  selEls().forEach(e => {
    const b = document.createElement("div"); b.className = "selbox" + (sels.length > 1 ? " multi" : "") + (e.lock ? " locked" : ""); b.dataset.for = e.id;
    Object.assign(b.style, { left: e.x + "px", top: e.y + "px", width: e.w + "px", height: e.h + "px", transform: e.rot ? `rotate(${e.rot}deg)` : "" });
    if (sels.length === 1 && !e.lock) b.innerHTML = ["nw", "n", "ne", "e", "se", "s", "sw", "w", "rot"].map(h => `<i data-h="${h}"></i>`).join("");
    st.appendChild(b);
  });
  applyZoom();
}
K.watch($("canvas"));
window.addEventListener("resize", () => K.fit($("canvas")));
function applyZoom() { const z = $("zoom").value; $("canvas").style.width = z === "fit" ? "100%" : K.W * (+z / 100) + "px"; $("canvas").style.maxWidth = z === "fit" ? "1100px" : "none"; K.fit($("canvas")); }
$("zoom").onchange = () => { applyZoom(); };

// ---------- select, move, resize, rotate, box-select ----------
let drag = null;
const k = () => $("canvas").clientWidth / K.W;
const stagePt = ev => { const r = $("canvas").getBoundingClientRect(), s = k(); return { x: (ev.clientX - r.left) / s, y: (ev.clientY - r.top) / s }; };
$("canvas").addEventListener("pointerdown", e => {
  if (e.target.closest("[contenteditable=true]")) return;
  const h = e.target.closest(".selbox i"), el = e.target.closest(".sk-el");
  if (h && sels.length === 1) { const o = elById(sels[0]); const p = stagePt(e);
    drag = { mode: h.dataset.h, p0: p, o: { ...o }, moved: false, cx: o.x + o.w / 2, cy: o.y + o.h / 2 }; e.preventDefault(); return; }
  if (!el) { stopEdit(); if (!e.shiftKey) clearSel(); drag = { mode: "marq", p0: stagePt(e), moved: false, base: [...sels] }; drawCanvas(); drawProps(); e.preventDefault(); return; }
  if (editing && editing !== el.dataset.id) stopEdit();
  const id = el.dataset.id;
  if (e.shiftKey || e.ctrlKey || e.metaKey) { sels = sels.includes(id) ? sels.filter(x => x !== id) : [...sels, id]; drawCanvas(); drawProps(); return; }
  if (!sels.includes(id)) { sels = [id]; drawCanvas(); drawProps(); }
  drag = { mode: "move", p0: stagePt(e), start: selEls().map(o => ({ id: o.id, x: o.x, y: o.y })), moved: false };
  e.preventDefault();
});
function guides(lines) { $("canvas").querySelectorAll(".guide").forEach(g => g.remove()); const st = $("canvas").querySelector(".sk-stage");
  lines.forEach(([v, pos]) => { const g = document.createElement("div"); g.className = "guide"; Object.assign(g.style, v ? { left: pos + "px", top: 0, width: "1px", height: K.H + "px" } : { top: pos + "px", left: 0, height: "1px", width: K.W + "px" }); st.appendChild(g); }); }
window.addEventListener("pointermove", e => {
  if (!drag) return;
  const p = stagePt(e), dx = p.x - drag.p0.x, dy = p.y - drag.p0.y;
  if (!drag.moved && Math.abs(dx) + Math.abs(dy) < 3) return;
  if (!drag.moved && drag.mode !== "marq") { hist.push(snap()); fut.length = 0; }
  drag.moved = true;
  const snapOn = $("snapOn").checked && !e.altKey, sn = v => snapOn ? Math.round(v / 5) * 5 : Math.round(v);
  if (drag.mode === "marq") {
    const x = Math.min(p.x, drag.p0.x), y = Math.min(p.y, drag.p0.y), w = Math.abs(dx), h = Math.abs(dy);
    let m = $("canvas").querySelector(".marq"); if (!m) { m = document.createElement("div"); m.className = "marq"; $("canvas").querySelector(".sk-stage").appendChild(m); }
    Object.assign(m.style, { left: x + "px", top: y + "px", width: w + "px", height: h + "px" });
    drag.box = { x, y, w, h }; return;
  }
  if (drag.mode === "move") {
    const lock = drag.start.some(s0 => elById(s0.id).lock); if (lock) return;
    let mx = dx, my = dy, lines = [];
    if (drag.start.length === 1 && snapOn) { const o = elById(drag.start[0].id), nx = drag.start[0].x + dx, ny = drag.start[0].y + dy;
      const cx = nx + o.w / 2, cy = ny + o.h / 2;
      if (Math.abs(cx - K.W / 2) < 8) { mx = K.W / 2 - o.w / 2 - drag.start[0].x; lines.push([1, K.W / 2]); }
      if (Math.abs(cy - K.H / 2) < 8) { my = K.H / 2 - o.h / 2 - drag.start[0].y; lines.push([0, K.H / 2]); }
      slide().els.forEach(q => { if (q.id === o.id) return; [[nx, q.x], [nx + o.w, q.x + q.w], [nx, q.x + q.w], [nx + o.w, q.x]].forEach(([a1, b1]) => { if (Math.abs(a1 - b1) < 6) { mx += b1 - a1; lines.push([1, b1]); } });
        [[ny, q.y], [ny + o.h, q.y + q.h], [ny, q.y + q.h], [ny + o.h, q.y]].forEach(([a1, b1]) => { if (Math.abs(a1 - b1) < 6) { my += b1 - a1; lines.push([0, b1]); } }); }); }
    drag.start.forEach(s0 => { const o = elById(s0.id); o.x = lines.length ? Math.round(s0.x + mx) : sn(s0.x + mx); o.y = lines.length ? Math.round(s0.y + my) : sn(s0.y + my); place(o); });
    guides(lines.slice(0, 4)); return;
  }
  const o = elById(sels[0]), o0 = drag.o, m = drag.mode;
  if (m === "rot") { let ang = Math.atan2(p.y - drag.cy, p.x - drag.cx) * 180 / Math.PI + 90; if (snapOn) ang = Math.round(ang / 15) * 15; o.rot = ((Math.round(ang) % 360) + 360) % 360; if (o.rot === 0) delete o.rot; place(o); return; }
  let { x, y, w, h } = o0;
  const keep = e.shiftKey && /^(nw|ne|sw|se)$/.test(m), ratio = o0.w / o0.h;
  if (m.includes("e")) w = Math.max(20, o0.w + dx);
  if (m.includes("s")) h = Math.max(10, o0.h + dy);
  if (m.includes("w")) { w = Math.max(20, o0.w - dx); x = o0.x + o0.w - w; }
  if (m.includes("n")) { h = Math.max(10, o0.h - dy); y = o0.y + o0.h - h; }
  if (keep) { h = w / ratio; if (m.includes("n")) y = o0.y + o0.h - h; }
  Object.assign(o, { x: sn(x), y: sn(y), w: sn(w), h: sn(h) }); place(o);
});
function place(o) { const node = $("canvas").querySelector(`.sk-el[data-id="${CSS.escape(o.id)}"]`), box = $("canvas").querySelector(`.selbox[data-for="${CSS.escape(o.id)}"]`);
  [node, box].forEach(n => n && Object.assign(n.style, { left: o.x + "px", top: o.y + "px", width: o.w + "px", height: o.h + "px", transform: o.rot ? `rotate(${o.rot}deg)` : "" })); }
window.addEventListener("pointerup", () => {
  if (!drag) return;
  if (drag.mode === "marq") { const m = $("canvas").querySelector(".marq"); if (m) m.remove();
    if (drag.box && drag.box.w + drag.box.h > 6) { const b = drag.box; sels = [...new Set([...drag.base, ...slide().els.filter(o => o.x < b.x + b.w && o.x + o.w > b.x && o.y < b.y + b.h && o.y + o.h > b.y).map(o => o.id)])]; drawCanvas(); drawProps(); } }
  else if (drag.moved) { dirty = true; local(); guides([]); drawThumbs(); drawCanvas(); drawProps(); $("undo").disabled = false; }
  drag = null;
});

// double-click: type in a text box or table cell
$("canvas").addEventListener("dblclick", e => {
  const cell = e.target.closest("td"), el = e.target.closest(".sk-el"); if (!el) return;
  const o = elById(el.dataset.id); if (!o) return;
  if (o.t === "text") startEdit(el, el.querySelector(".sk-txt > div"), v => o.html = v);
  if (o.t === "table" && cell) startEdit(el, cell, v => o.rows[+cell.dataset.r][+cell.dataset.c] = v);
});
let editDone = null;
function startEdit(el, node, save) {
  stopEdit(); hist.push(snap()); fut.length = 0;
  editing = el.dataset.id; el.classList.add("editing"); node.contentEditable = "true"; node.focus();
  const r = document.createRange(); r.selectNodeContents(node); r.collapse(false); const s = getSelection(); s.removeAllRanges(); s.addRange(r);
  editDone = () => { save(K.clean(node.innerHTML)); node.contentEditable = "false"; el.classList.remove("editing"); editing = null; dirty = true; local(); drawThumbs(); };
}
function stopEdit() { if (editDone) { const f = editDone; editDone = null; f(); } }

// ---------- keyboard ----------
let clip = null;
document.addEventListener("keydown", e => {
  const typing = e.target.isContentEditable || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName), ctrl = e.ctrlKey || e.metaKey, key = e.key.toLowerCase();
  if (e.key === "Escape" && editing) { stopEdit(); drawCanvas(); return; }
  if (e.key === "Escape" && sels.length && !e.target.closest("dialog")) { clearSel(); drawCanvas(); drawProps(); return; }
  if (ctrl && key === "s") { e.preventDefault(); stopEdit(); saveDeck().catch(er => alert("Could not save: " + er.message)); return; }
  if (typing) return;
  if (ctrl && key === "z") { e.preventDefault(); e.shiftKey ? $("redo").click() : $("undo").click(); return; }
  if (ctrl && key === "y") { e.preventDefault(); $("redo").click(); return; }
  if (ctrl && key === "a") { e.preventDefault(); sels = slide().els.map(o => o.id); drawCanvas(); drawProps(); return; }
  if (ctrl && key === "v" && clip) { e.preventDefault(); change(() => { const copies = JSON.parse(clip).map(o => ({ ...o, id: K.uid(), x: o.x + 20, y: o.y + 20 })); slide().els.push(...copies); sels = copies.map(o => o.id); clip = JSON.stringify(copies); }); return; }
  if (!sels.length) return;
  if (ctrl && (key === "c" || key === "x")) { e.preventDefault(); clip = JSON.stringify(selEls()); if (key === "x") delSel(); stat(key === "c" ? "Copied" : "Cut"); return; }
  if (e.key === "Delete" || e.key === "Backspace") { e.preventDefault(); delSel(); }
  if (ctrl && key === "d") { e.preventDefault(); dupSel(); }
  const mv = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
  if (mv) { e.preventDefault(); const st = e.shiftKey ? 10 : 2; change(() => selEls().forEach(o => { if (!o.lock) { o.x += mv[0] * st; o.y += mv[1] * st; } })); }
});
const delSel = () => change(() => { slide().els = slide().els.filter(x => !sels.includes(x.id) || x.lock); clearSel(); });
const dupSel = () => change(() => { const copies = selEls().map(o => ({ ...JSON.parse(JSON.stringify(o)), id: K.uid(), x: o.x + 20, y: o.y + 20, z: topZ() })); slide().els.push(...copies); sels = copies.map(o => o.id); });

// ---------- insert ----------
const topZ = () => Math.max(1, ...slide().els.map(x => x.z || 1)) + 1;
const add = o => change(() => { o.id = K.uid(); o.z = topZ(); slide().els.push(o); sels = [o.id]; });
// text is white on dark slides and dark on light slides, so a new box is always readable
const inkFor = bg => { const m = /^#([0-9a-f]{6})$/i.exec(bg || "#ffffff"); if (!m) return "#1E2433"; const n = parseInt(m[1], 16), l = (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)); return l < 140 ? "#FFFFFF" : "#1E2433"; };
$("addText").onclick = () => add({ t: "text", x: 140, y: 200, w: 700, h: 120, html: "Double-click to type", fs: 32, color: inkFor(slide().bg), font: "Inter", align: "left", lh: 1.35 });
$("addShape").innerHTML = `<option value="">＋ Shape…</option>` + Object.entries(K.SHAPES).map(([v, n]) => `<option value="${v}">${E(n)}</option>`).join("");
$("addShape").onchange = e => { const s = e.target.value; e.target.value = ""; if (!s) return;
  add(s === "line" ? { t: "shape", shape: "line", x: 200, y: 340, w: 600, h: 20, stroke: "#1F3A93", sw: 6 } : { t: "shape", shape: s, x: 440, y: 200, w: 300, h: s === "ellipse" || s === "star" || s === "hexagon" ? 300 : 220, fill: "#EEF2FC", stroke: "#1F3A93", sw: 3 }); };
$("addTable").onclick = () => add({ t: "table", x: 100, y: 160, w: 1080, h: 360, fs: 24, head: true, headFill: "#1F3A93", headColor: "#FFFFFF", border: "#D9D2C2", color: "#1E2433", rows: [["Heading", "Heading", "Heading"], ["", "", ""], ["", "", ""]] });
$("addSlide").innerHTML = `<option value="">＋ New slide…</option>` + Object.entries(K.TEMPLATES).map(([key, t]) => `<option value="${key}">${E(t.name)}</option>`).join("");
$("addSlide").onchange = e => { const v = e.target.value; e.target.value = ""; if (v) addSlide(v); };
const addSlide = key => change(() => { deck.slides.splice(cur + 1, 0, K.TEMPLATES[key].make()); cur++; clearSel(); });
$("bg").oninput = e => { slide().bg = e.target.value; drawCanvas(); };
$("bg").onchange = e => change(() => slide().bg = e.target.value);
$("title").onchange = e => change(() => deck.title = e.target.value.trim());

// pictures: shrink big photos, upload to assets/uploads, show at once from memory
async function uploadPicture(file, prefix) {
  const img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => no(new Error("That file isn't a picture.")); i.src = URL.createObjectURL(file); });
  const max = 1600, r = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight)), c = document.createElement("canvas");
  c.width = Math.round(img.naturalWidth * r); c.height = Math.round(img.naturalHeight * r); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  const png = /png|gif|webp|svg/.test(file.type), data = c.toDataURL(png ? "image/png" : "image/jpeg", 0.88);
  const path = `assets/uploads/${prefix || "slide"}-${Date.now().toString(36)}${Math.random().toString(36).slice(2, 5)}.${png ? "png" : "jpg"}`;
  K.memory[path] = data;
  write(path, data.split(",")[1], "Admin: slide picture").catch(er => stat("Picture not saved: " + er.message));
  return { path, w: c.width, h: c.height };
}
$("addImg").onclick = () => $("imgFile").click();
$("imgFile").onchange = async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  try { stat("Adding picture…"); const p = await uploadPicture(f);
    const w = Math.min(600, p.w), h = Math.min(Math.round(w * p.h / p.w), 560);
    add({ t: "img", src: p.path, x: Math.round((K.W - w) / 2), y: Math.round((K.H - h) / 2), w, h }); stat("Picture added");
  } catch (er) { stat(""); alert("Could not add the picture: " + er.message); }
};
window.__uploadPicture = uploadPicture;

// ---------- properties panel ----------
const FONTN = { Inter: "Inter", Poppins: "Poppins (headings)", Hind: "Hind (हिन्दी)", Merriweather: "Merriweather", Georgia: "Georgia", Courier: "Courier", Arial: "Arial" };
const ANIMS = { "": "None", fade: "Fade in", up: "Rise up", left: "Fly in from left", zoom: "Zoom in" };
function drawProps() {
  const p = $("props"), list = selEls();
  if (!list.length) {
    p.innerHTML = `<h3>Slide ${cur + 1}</h3>
      <label>Transition to this slide<select id="trSel">${[["none", "None"], ["fade", "Fade"], ["slide", "Slide in"], ["zoom", "Zoom"]].map(([v, n]) => `<option value="${v}"${(slide().tr || "none") === v ? " selected" : ""}>${n}</option>`).join("")}</select></label>
      <div class="grp" style="margin-top:10px"><button type="button" id="trAll">Use this transition on all slides</button></div><hr>
      <p class="help"><b>Click</b> a box to select it, <b>Shift+click</b> or drag on empty space to select many. <b>Drag</b> to move, pull the white corners to resize (Shift keeps the shape), the blue dot rotates.<br><b>Double-click</b> text or a table cell to type.<br>Ctrl+C / Ctrl+V copy and paste (also to another slide), Ctrl+D duplicate, Ctrl+A select all, Delete, arrow keys, Ctrl+Z undo, Ctrl+S save. Hold Alt while dragging to stop snapping.</p>`;
    p.querySelector("#trSel").onchange = e => change(() => slide().tr = e.target.value);
    p.querySelector("#trAll").onclick = () => change(() => deck.slides.forEach(s => s.tr = slide().tr || "none"));
    return;
  }
  if (list.length > 1) {

  if (k === "theme") Ribbon.menu(b, Object.entries(THEMES).map(([v, t]) => [v, `<span style="display:inline-block;width:14px;height:14px;border-radius:3px;border:1px solid #0003;vertical-align:-2px;margin-right:8px;background:${t[1]}"></span>${t[0]}`]), v => {
    const [, bgc, ink] = THEMES[v]; change(() => deck.slides.forEach(sl => { sl.bg = bgc; (sl.els || []).forEach(o => { if (o.t === "text") o.color = ink; }); })); stat("Theme applied to all slides"); });
  if (k === "sym") Ribbon.symbols(b, t => { const ed = document.querySelector("#canvas .sk-el.editing .sk-txt"); if (!ed) return stat("Double-click a text box first, then pick a symbol");
    ed.focus(); document.execCommand("insertText", false, t); });
});
$("ribbon").addEventListener("mousedown", e => { if (e.target.closest("[data-pop=sym]")) e.preventDefault(); });
$("addText2").onclick = () => $("addText").click(); $("addImg2").onclick = () => $("addImg").click(); $("addTable2").onclick = () => $("addTable").click();
$("dupSlideBtn").onclick = () => change(() => { deck.slides.splice(cur + 1, 0, JSON.parse(JSON.stringify(slide()))); deck.slides[cur + 1].els.forEach(o => o.id = K.uid()); cur++; clearSel(); });
$("delSlideBtn").onclick = () => { if (deck.slides.length < 2) return stat("A deck needs at least one slide"); if (!confirm(`Delete slide ${cur + 1}?`)) return; change(() => { deck.slides.splice(cur, 1); cur = Math.min(cur, deck.slides.length - 1); clearSel(); }); };
$("bgAll").onclick = () => change(() => { const c = slide().bg || "#FFFFFF"; deck.slides.forEach(sl => sl.bg = c); });
// PDF → one slide per page
$("pdfInBtn").onclick = $("pdfInBtn2").onclick = () => $("pdfFile").click();
$("pdfFile").onchange = async e => { const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  try { stat("Reading PDF…");
    const pages = await Ribbon.pdfPages(await f.arrayBuffer(), 1.6, (i, n) => stat(`Reading PDF page ${i} of ${n}…`)), made = [];
    for (let i = 0; i < pages.length; i++) { const c = pages[i], data = c.toDataURL("image/jpeg", 0.85), path = `assets/uploads/pdfslide-${Date.now().toString(36)}-${i + 1}.jpg`;
      K.memory[path] = data; stat(`Saving page ${i + 1} of ${pages.length}…`); await write(path, data.split(",")[1], "Admin: PDF slide");
      const r = Math.min(K.W / c.width, K.H / c.height), w = Math.round(c.width * r), h = Math.round(c.height * r);
      made.push({ bg: "#FFFFFF", els: [{ t: "img", id: K.uid(), z: 1, src: path, x: Math.round((K.W - w) / 2), y: Math.round((K.H - h) / 2), w, h }] }); }
    const blankDeck = deck.slides.length === 1 && !deck.slides[0].els.length;
    change(() => { if (blankDeck) { deck.slides = made; cur = 0; } else { deck.slides.splice(cur + 1, 0, ...made); cur++; } clearSel(); });
    stat(`${made.length} slides added from the PDF`);
  } catch (er) { stat("Could not read the PDF: " + er.message); } };
$("saveTop").onclick = () => $("saveBtn").click(); $("pubTop").onclick = () => $("pubBtn").click();
// inside the admin Notes tab: the admin page saves the slides with the chapter
window.SSCEmbed = {
  empty: () => !deck || deck.slides.every(sl => !(sl.els || []).length),
  dirty: () => dirty,
  async save(extra) { if (extra && extra.title) $("title").value = extra.title; await saveDeck(extra); return id; },
  ready: false
};
open().then(() => { window.SSCEmbed.ready = true; });
})();
</script>
