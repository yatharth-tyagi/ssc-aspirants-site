<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- ssc-build 5/7 IFQ= -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SSC Previous Year Papers – SSCAspirants_Official</title>
<meta name="description" content="Mock tests on the latest Eduquity CBT pattern, chapter-wise notes and previous year papers for SSC CGL, CHSL, MTS, GD, CPO and more.">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/site.css">

<script>try{document.documentElement.dataset.read=localStorage.getItem("ssc-read")==="dark"?"dark":"light";document.documentElement.style.setProperty("--scale",localStorage.getItem("ssc-scale")||1)}catch(e){}</script>
</head>
<body data-page="pyq" data-title="PYQ Papers">
<main id="content" class="content">
<style>
.filters{display:flex;flex-wrap:wrap;gap:12px;align-items:end}
.filters label{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:.9rem}
.filters select{min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit;font-size:16px;padding:0 12px;min-width:180px}
</style>
<section class="card"><div class="sec-head"><h2>Previous year papers</h2><p>Attempt as a timed test or read with answers</p></div>
<div class="filters">
<label for="fExam">Exam<select id="fExam"></select></label>
<label for="fYear">Year<select id="fYear"><option value="">All years</option><option>2025</option><option>2024</option><option>2023</option></select></label>
<label for="fSub">Subject<select id="fSub"><option value="">All subjects (full paper)</option><option>Reasoning</option><option>General Awareness</option><option>Quantitative Aptitude</option><option>English</option></select></label>
</div></section>
<section id="list" style="display:flex;flex-direction:column;gap:10px"></section>
<p class="muted" style="margin:0">Papers are being added. Exam dates and shifts will show here as each paper is uploaded.</p>
</main>
<script src="data/subjects.js"></script>
<script src="data/exams.js"></script>
<script src="data/site.js"></script>
<script src="assets/site.js"></script>
<script>
{
const EX={cgl:"SSC CGL",chsl:"SSC CHSL",mts:"SSC MTS",gd:"SSC GD",cpo:"SSC CPO",sp:"Selection Post"};
const fE=document.getElementById("fExam"),fY=document.getElementById("fYear"),fS=document.getElementById("fSub"),list=document.getElementById("list");
fE.innerHTML=Object.entries(EX).map(([k,v])=>`<option value="${k}">${v}</option>`).join("");
const h=(location.hash||"").slice(1); if(EX[h]) fE.value=h;
function draw(){
  const ex=EX[fE.value], yrs=fY.value?[fY.value]:["2025","2024","2023"], sub=fS.value;
  list.innerHTML=yrs.map(y=>`<h2 style="font-size:1.2rem;margin-top:10px">${ex} ${y}</h2>`+[1,2,3].map(s=>
    `<div class="row"><span class="num">S${s}</span><span class="t"><b>${ex} ${y} · Shift ${s}${sub?" · "+sub:""}</b><span>Exam date to be added</span></span><span class="btn off" aria-disabled="true">Attempt · soon</span></div>`).join("")).join("");
}
[fE,fY,fS].forEach(x=>x.addEventListener("change",()=>{history.replaceState(null,"","#"+fE.value);draw();}));
draw();
}
</script>
</body>
</html>
