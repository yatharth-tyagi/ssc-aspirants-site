<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Courses – SSCAspirants_Official</title>
<meta name="description" content="Subject-wise and complete courses for SSC exams: video lectures, live classes, notes, PDFs and tests.">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#141B38"><link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/site.css">

<script>try{document.documentElement.dataset.read=localStorage.getItem("ssc-read")==="dark"?"dark":"light";document.documentElement.style.setProperty("--scale",localStorage.getItem("ssc-scale")||1)}catch(e){}</script>
</head>
<body data-page="courses" data-title="Courses">
<main id="content" class="content">
<style>
.cgrid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.ccard{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);color:var(--ink);transition:transform .15s,border-color .15s}
.ccard:hover{transform:translateY(-3px);border-color:var(--pri);text-decoration:none}
.ccov{position:relative;padding:20px;color:#fff;min-height:128px;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;background:var(--c,#1F3A93)}
.ccov::after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:#ffffff1a}
.ccov b{font:700 1.15rem/1.3 Poppins,sans-serif;position:relative;z-index:1}
.ccov .tag{align-self:flex-start;background:#ffffff26;border:1px solid #ffffff40;border-radius:999px;padding:2px 10px;font-size:.78rem;font-weight:700;position:relative;z-index:1}
.cbody{padding:16px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
.cmeta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:.9rem}
.price{display:flex;align-items:baseline;gap:8px;margin-top:auto}
.price b{font:700 1.3rem Poppins,sans-serif;color:var(--ink)}.price s{color:var(--muted)}.price .off{color:var(--ok);font-weight:700;font-size:.88rem}
.free{color:var(--ok)!important}
.ftabs{display:flex;gap:8px;flex-wrap:wrap}
.ftabs button{min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600}
.ftabs button[aria-pressed="true"]{background:var(--pri);color:#fff;border-color:var(--pri)}
</style>
<section><div class="sec-head"><h2>Courses</h2><p>Learn subject by subject, or take a complete course for your exam</p></div>
<div class="ftabs" id="ftabs" role="group" aria-label="Show"><button type="button" data-f="all" aria-pressed="true" data-l="crs.fAll">All courses</button><button type="button" data-f="full" aria-pressed="false" data-l="crs.fFull">Complete courses</button><button type="button" data-f="subject" aria-pressed="false" data-l="crs.fSubject">Subject courses</button><button type="button" data-f="mine" aria-pressed="false" data-l="crs.fMine">My courses</button></div></section>
<section data-dyn="1"><div class="cgrid" id="cgrid"></div></section>
</main>
<script src="data/subjects.js"></script>
<script src="data/exams.js"></script>
<script src="data/courses.js"></script>
<script src="data/site.js"></script>
<script src="assets/site.js"></script>
<script src="assets/courses.js"></script>
<script>
{
const E=SSC.esc, C=(window.COURSES||[]).filter(c=>!c.hide);
let f="all", mine=[];
function draw(){
  const list=C.filter(c=>f==="all"||(f==="mine"?mine.includes(c.id):c.type===f));
  document.getElementById("cgrid").innerHTML=list.length?list.map(c=>CourseKit.card(c,mine.includes(c.id))).join(""):`<p class="muted">${f==="mine"?"You have not joined a course yet.":"New courses are coming soon."}</p>`;
}
document.getElementById("ftabs").addEventListener("click",e=>{const b=e.target.closest("[data-f]");if(!b)return;f=b.dataset.f;document.querySelectorAll("#ftabs button").forEach(x=>x.setAttribute("aria-pressed",x===b));draw();});
CourseKit.enrolled().then(l=>{mine=l;draw();});draw();
}
</script>
</body>
</html>
