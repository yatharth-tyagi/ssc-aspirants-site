<script>
main: {
const $ = id => document.getElementById(id), E = SSC.esc, P = new URLSearchParams(location.search);
const KEY = (P.get("id") || "polity-ch1-4").replace(/[^a-z0-9_-]/gi, ""), N = +P.get("n") || 0;
// ---------- the test's questions (same as test.html) ----------
let T = window.TESTS && TESTS[KEY];
if (!T && KEY === "polity-ch1-4") { const qs = []; SUBJECTS.find(s => s.id === "polity").chapters.map(c => c.id).filter(id => NOTES[id]).forEach(id => (NOTES[id].quiz || []).forEach(q => qs.push({ ...q, section: "Indian Polity", topic: NOTES[id].title })));
  T = { title: "Indian Polity – Chapters 1 to 4", plus: 2, minus: 0.5, sectional: false, questions: qs }; }
if (!T) { $("main").innerHTML = `<div class="card"><p>This test was not found.</p><a class="btn btn-pri" href="mock-tests.html">See mock tests</a></div>`; break main; }
const PLUS = +T.plus || 2, MINUS = +T.minus || 0;
const SECS = T.sectional && T.sections && T.sections.length ? T.sections : [{ name: (T.questions[0] && T.questions[0].section) || "All questions" }];
const Q = T.questions.map(q => ({ ...q, sec: T.sectional ? Math.max(0, SECS.findIndex(s => s.name === q.section)) : 0 }));
const hasHindi = Q.some(q => q.qh);
document.title = "Solutions – " + T.title + " – SSCAspirants_Official";
$("nm").innerHTML = E(T.title) + "<small>Solutions · SSCAspirants_Official</small>";
$("backBtn").href = (KEY === "polity-ch1-4" ? "test.html?view=result" : "test.html?id=" + encodeURIComponent(KEY) + "&view=result");
$("seriesLink").innerHTML = "‹ " + $("seriesLink").innerHTML; $("seriesLink").href = KEY === "polity-ch1-4" ? "notes.html#polity" : SSCSeriesUrl(T);
if (N) $("backBtn").href += "&n=" + N;

// ---------- pictures and maths ----------
const src = s => { s = String(s || "").trim(); if (!s) return ""; if (/^https:\/\//i.test(s)) return s; if (/^(assets\/|\/assets\/)/.test(s)) return s.replace(/^\//, ""); if (/^[a-z0-9._-]+$/i.test(s)) return "assets/uploads/" + s; return ""; };
const pic = (s, alt) => { const u = src(s); return u ? `<img class="qimg" src="${E(u)}" alt="${E(alt || "")}" loading="lazy">` : ""; };
const hasMath = Q.some(q => /\$|\\\(/.test([q.q, q.qh, ...(q.opts || []), ...(q.optsh || []), q.why, q.whyh].join(" ")));
let mathP = null;
const math = el => { if (!hasMath) return; if (!mathP) { const c = document.createElement("link"); c.rel = "stylesheet"; c.href = "https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"; document.head.appendChild(c);
    const js = u => new Promise((ok, no) => { const s = document.createElement("script"); s.src = u; s.onload = ok; s.onerror = no; document.head.appendChild(s); });
    mathP = js("https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js").then(() => js("https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js")).then(() => true, () => false); }
  mathP.then(ok => ok && window.renderMathInElement && renderMathInElement(el, { delimiters: [{ left: "$$", right: "$$", display: true }, { left: "$", right: "$", display: false }, { left: "\\(", right: "\\)", display: false }], throwOnError: false })); };

// ---------- state ----------
let ans = null, tm = [], bms = new Set(), lang = "en", dist = null, ST = null, dir = 0, filt = "all", secF = "all", cur = 0;
const RK = "ssc-retry:" + KEY; let retry = {}; try { retry = JSON.parse(sessionStorage.getItem(RK) || "{}"); } catch (e) {}
const saveRetry = () => { try { sessionStorage.setItem(RK, JSON.stringify(retry)); } catch (e) {} };
const L = k => String.fromCharCode(65 + k);
const stOf = i => ans[i] == null ? "s" : ans[i] === Q[i].a ? "r" : "w";
const txt = q => (lang === "hi" && q.qh) ? { q: q.qh, o: q.optsh || q.opts, hi: true } : { q: q.q, o: q.opts, hi: false };
const inSec = s => Q.map((q, i) => i).filter(i => Q[i].sec === s);
const pctRight = i => { const d = dist && dist[i]; if (!d) return null; const t = d.reduce((a, b) => a + b, 0); return t ? Math.round(d[Q[i].a] / t * 100) : null; };
const diffOf = p => p == null ? ["d-n", "–"] : p >= 70 ? ["d-e", "Easy"] : p >= 40 ? ["d-m", "Moderate"] : ["d-h", "Hard"];
const fmtT = s => { s = Math.round(s || 0); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return (h ? h + ":" : "") + String(m).padStart(h ? 2 : 1, "0") + ":" + String(x).padStart(2, "0"); };

// ---------- load my answers (this device first, then the server) ----------
async function load() {
  let rec = null;
  if (!N) { try { rec = JSON.parse(localStorage.getItem("ssc-last:" + KEY) || "null"); } catch (e) {} }
  let BMS = null; try { BMS = JSON.parse(SSC.store.get("ssc-bm", "{}"))[KEY] || null; } catch (e) {}
  if (rec && rec.ans && rec.ans.length === Q.length) { ans = rec.ans; tm = rec.spent || []; bms = new Set(rec.bms || []); lang = rec.lang || "en"; if (rec.d && rec.d.stats) { ST = rec.d.stats; dist = ST.dist; } }
  else { try { const r = await fetch(`/api/me/attempt?test=${encodeURIComponent(KEY)}${N ? "&n=" + N : ""}`); const d = await r.json(); if (!r.ok || !d.ans) throw 0; ans = d.ans; tm = d.tm || []; } catch (e) {} }
  if (BMS) bms = new Set(BMS);
  // saved questions kept in the account (so they show on every device)
  try { const r = await fetch("/api/me/saved?test=" + encodeURIComponent(KEY)); if (r.ok) (await r.json()).saved.forEach(x => bms.add(x.q)); } catch (e) {}
  if (!ans || ans.length !== Q.length) { $("main").innerHTML = `<div class="card"><p>We couldn't find your answers for this test. Take the test first, then the solutions open here.</p><a class="btn btn-pri" href="${KEY === "polity-ch1-4" ? "test.html" : "test.html?id=" + encodeURIComponent(KEY)}">Take the test</a></div>`; return; }
  if (!dist) { try { const r = await fetch(`/api/attempts?test=${encodeURIComponent(KEY)}&stats=${Q.length}`); const d = await r.json(); if (d.stats) { ST = d.stats; dist = ST.dist; } } catch (e) {} }
  if (hasHindi) { $("langBtn").hidden = false; $("langBtn").textContent = lang === "hi" ? "English" : "हिन्दी"; }
  route();
}
$("langBtn").onclick = () => { lang = lang === "hi" ? "en" : "hi"; $("langBtn").textContent = lang === "hi" ? "English" : "हिन्दी"; route(); };
window.addEventListener("hashchange", route);
function route() { const m = /q=(\d+)/.exec(location.hash); if (m && +m[1] >= 1 && +m[1] <= Q.length) { const nx = +m[1] - 1; dir = nx > cur ? 1 : nx < cur ? -1 : 0; cur = nx; drawQ(); } else drawList(); window.scrollTo(0, 0); }
const strip = () => `<div class="strip" role="navigation" aria-label="All questions">${Q.map((q, i) => `<a href="#q=${i + 1}" class="sg s-${stOf(i)}${location.hash === "#q=" + (i + 1) ? " on" : ""}" title="Question ${i + 1}"></a>`).join("")}</div>`;

// ---------- summary + list of questions ----------
function totals() {
  let r = 0, w = 0; ans.forEach((a, i) => { if (a == null) return; a === Q[i].a ? r++ : w++; });
  return { r, w, s: Q.length - r - w, score: +(r * PLUS - w * MINUS).toFixed(2), acc: r + w ? Math.round(r / (r + w) * 100) : 0, time: tm.reduce((a, b) => a + (+b || 0), 0) };
}
function drawList() {
  document.body.classList.remove("grid-open");
  const t = totals();
  const rows = Q.map((q, i) => i).filter(i => (secF === "all" || Q[i].sec === +secF) && (filt === "all" || (filt === "b" ? bms.has(i) : stOf(i) === filt)));
  $("main").innerHTML = `
    <div class="sban"><img src="assets/logo.png" alt=""><div><span class="kick">Solutions &amp; review</span><h1>${E(T.title)}</h1><p>Tap any question to see the options, the solution and to reattempt it.</p></div>
      <div class="sbring"><svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="15.9" fill="none" stroke="#ffffff22" stroke-width="3.5"/><circle cx="18" cy="18" r="15.9" fill="none" stroke="#F5C451" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="${Math.max(0, t.score) / (Q.length * PLUS) * 100} 100" transform="rotate(-90 18 18)"/></svg><b>${t.score}</b><span>/ ${Q.length * PLUS}</span></div></div>
    ${strip()}
    <div class="tiles">
      <div class="tile big"><i>★</i><div><b>${t.score} / ${Q.length * PLUS}</b><span>Score</span></div></div>
      <div class="tile"><i>?</i><div><b>${Q.length}</b><span>Questions</span></div></div>
      <div class="tile gold"><i>⏱</i><div><b>${fmtT(t.time)}</b><span>Time taken</span></div></div>
      <div class="tile"><i>◎</i><div><b>${t.acc}%</b><span>Accuracy</span></div></div>
      <div class="tile ok"><i>✓</i><div><b>${t.r}</b><span>Right</span></div></div>
      <div class="tile bad"><i>✗</i><div><b>${t.w}</b><span>Wrong</span></div></div>
      <div class="tile"><i>–</i><div><b>${t.s}</b><span>Unattempted</span></div></div>
    </div>
    <div class="ctrl"><div class="chips" id="filt">${[["all", "All"], ["w", "Wrong"], ["s", "Unattempted"], ["r", "Right"], ["b", "Bookmarked"]].map(([k, n]) => `<button class="chip" type="button" data-f="${k}" aria-pressed="${filt === k}">${n}</button>`).join("")}</div>
      ${SECS.length > 1 ? `<select id="secSel" aria-label="Section"><option value="all">All sections</option>${SECS.map((s, i) => `<option value="${i}"${secF === String(i) ? " selected" : ""}>${E(s.name)}</option>`).join("")}</select>` : ""}</div>
    <div class="qlist"><div class="qrow head"><span>No</span><span>Question</span><span>Status</span><span>Time</span><span>Level</span><span>Students right</span></div>
    ${rows.map(i => { const st = stOf(i), p = pctRight(i), d = diffOf(p), tx = txt(Q[i]);
      return `<button class="qrow" type="button" data-i="${i}"><span class="num s-${st}">${i + 1}</span><span class="qt${tx.hi ? " hi" : ""}">${E(tx.q.replace(/\s+/g, " "))}</span>
        <span class="st ${st}">● ${{ r: "Right", w: "Wrong", s: "Not attempted" }[st]}</span><span class="tm">${Math.round(tm[i] || 0)}s</span><span class="diff ${d[0]}">${d[1]}</span>
        <span class="pct">${p == null ? "–" : `<span class="tr"><span style="width:${p}%"></span></span>${p}%`}</span></button>`; }).join("") || `<p class="muted">No questions here.</p>`}</div>`;
  $("filt").onclick = e => { const b = e.target.closest("[data-f]"); if (b) { filt = b.dataset.f; drawList(); } };
  if ($("secSel")) $("secSel").onchange = e => { secF = e.target.value; drawList(); };
  $("main").querySelector(".qlist").onclick = e => { const b = e.target.closest("[data-i]"); if (b) location.hash = "q=" + (+b.dataset.i + 1); };
  math($("main"));
}

// ---------- one question ----------
function drawQ() {
  const i = cur, q = Q[i], tx = txt(q), st = stOf(i), p = pctRight(i), d = diffOf(p), R = retry[i], inRetry = R && R.on;
  const why = lang === "hi" && q.whyh ? q.whyh : q.why, wimg = lang === "hi" && q.wimgh ? q.wimgh : q.wimg, t = totals();
  const dd = dist && dist[i], tot = dd ? dd.reduce((a, b) => a + b, 0) : 0;
  const showAns = !inRetry || R.pick != null;
  const optCls = k => { if (inRetry) { if (R.pick == null) return ""; return k === q.a ? "c" : k === R.pick ? "w" : ""; } return k === q.a ? "c" : k === ans[i] ? "w" : ""; };
  const tv = ST && (ST.topAns || ST.avgT) ? (() => { const ta = ST.topAns ? ST.topAns[i] : undefined, tt = ST.topT ? ST.topT[i] : null, at = ST.avgT ? ST.avgT[i] : null;
      const stx = v => v == null ? '<span class="st s">● Skipped</span>' : v === q.a ? '<span class="st r">● Right</span>' : '<span class="st w">● Wrong</span>';
      return `<div class="tvy"><h3>Topper vs You</h3><table><thead><tr><th></th><th>Answer</th><th>Time</th></tr></thead><tbody>
        <tr class="me"><td>👤 You</td><td>${stx(ans[i])}</td><td>${Math.round(tm[i] || 0)}s</td></tr>
        ${ta !== undefined ? `<tr><td>🏆 Topper</td><td>${stx(ta)}</td><td>${tt != null ? Math.round(tt) + "s" : "–"}</td></tr>` : ""}
        <tr><td>👥 Average</td><td>${p == null ? "–" : p + "% right"}</td><td>${at != null ? at + "s" : "–"}</td></tr></tbody></table></div>`; })() : "";
  $("main").innerHTML = `${strip()}<div class="qview"><section class="qmain card ${dir > 0 ? "in-r" : dir < 0 ? "in-l" : "in"}" id="qcard">
      <div class="qtop"><span class="qbadge s-${st}">${st === "r" ? "✓" : st === "w" ? "✗" : "–"}</span><span class="qn">Question ${i + 1}<small> / ${Q.length}${SECS.length > 1 ? " · " + E(SECS[q.sec].name) : ""}</small></span>
        <span class="chipx" title="Your time">⏱ ${Math.round(tm[i] || 0)}s</span><span class="chipx" title="Students who got it right">◎ ${p == null ? "–" : p + "%"}</span><span class="diff ${d[0]}">${d[1]}</span>
        <button class="ib" type="button" id="bm" aria-pressed="${bms.has(i)}">${bms.has(i) ? "★ Saved" : "☆ Save"}</button>
        <button class="ib qdrawer" type="button" id="gridBtn">▦ Questions</button></div>
      <div class="blk"><div class="blk-h">Question</div><p class="qtext${tx.hi ? " hi" : ""}">${E(tx.q)}</p>${pic(q.img, "Question picture")}</div>
      <div class="blk"><div class="blk-h">Options</div><div class="ops${inRetry && R.pick == null ? " retry" : ""}" id="ops">${tx.o.map((o, k) => { const c = optCls(k);
        return `<button class="op ${c}${tx.hi ? " hi" : ""}" style="--d:${k * 70}ms" type="button" data-k="${k}" ${inRetry && R.pick == null ? "" : "tabindex='-1'"}><span class="lt">${L(k)}</span><span class="ot">${E(o)}${q.oimg ? pic(q.oimg[k], "Option " + L(k)) : ""}</span>
          ${showAns && tot && !inRetry ? `<span class="who">${Math.round(dd[k] / tot * 100)}% chose</span>` : ""}${c === "c" ? '<span class="mk">✓</span>' : c === "w" ? '<span class="mk">✗</span>' : ""}</button>`; }).join("")}</div></div>
      <div class="blk vblk">${inRetry ? (R.pick == null ? `<div class="retrybar"><b>↻ Reattempt:</b> choose your answer again. <button class="ib" type="button" id="rCancel">Cancel</button></div>`
          : `<div class="retrybar"><b class="${R.pick === q.a ? "ok-t" : "bad-t"}">${R.pick === q.a ? "✓ Correct this time!" : "✗ Not right – correct answer is " + L(q.a)}</b><button class="ib" type="button" id="rAgain">↻ Try again</button><button class="ib" type="button" id="rDone">Show my test answer</button></div>`)
        : `<p class="verdict ${st === "r" ? "ok-t" : st === "w" ? "bad-t" : "muted"}">${st === "r" ? "✓ You answered correctly" : st === "w" ? `✗ Your answer ${L(ans[i])} is wrong · Correct answer ${L(q.a)}` : `You didn't attempt this · Correct answer ${L(q.a)}`}</p>
          <div><button class="btn btn-out" type="button" id="rStart">↻ Reattempt this question</button>${R && R.last != null ? ` <span class="muted" style="font-size:.88rem">Last retry: ${R.last ? "✓ correct" : "✗ wrong"}</span>` : ""}</div>`}</div>
      ${showAns && !inRetry ? tv : ""}
      ${showAns && (why || wimg) ? `<div class="solbox"><h3>💡 Solution</h3>${why ? `<p class="${lang === "hi" && q.whyh ? "hi" : ""}">${E(why)}</p>` : ""}${pic(wimg, "Solution")}</div>` : ""}
    </section>
    <aside class="side card" id="side">
      <div class="blk-h" style="margin:0">Your test</div>
      <div class="cnt"><div><b>${fmtT(t.time)}</b>Time</div><div><b>${t.acc}%</b>Accuracy</div><div><b>${t.score}</b>Score</div></div>
      <div class="cnt"><div><b class="ok-t">${t.r}</b>Right</div><div><b class="bad-t">${t.w}</b>Wrong</div><div><b>${t.s}</b>Skipped</div></div>
      <div class="blk-h" style="margin:4px 0 0">Question palette</div>
      <div class="secs">${SECS.map((s, si) => `<div class="secbox">${SECS.length > 1 ? `<div class="sechead">${E(s.name)}</div>` : ""}<div class="grid2">${inSec(si).map(j => `<button type="button" class="s-${stOf(j)}${j === i ? " on" : ""}${retry[j] && retry[j].last != null ? " rt" : ""}" data-j="${j}" aria-label="Question ${j + 1}">${j + 1}</button>`).join("")}</div></div>`).join("")}</div>
      <div class="legend"><span><i class="s-r"></i>Right</span><span><i class="s-w"></i>Wrong</span><span><i class="s-s"></i>Skipped</span></div>
    </aside></div>
    <nav class="navb"><button class="btn btn-out" type="button" id="prevB" ${i === 0 ? "disabled" : ""}>‹ Previous</button><button class="btn btn-pri" type="button" id="listB">☰ All questions</button><button class="btn btn-out" type="button" id="nextB" ${i === Q.length - 1 ? "disabled" : ""}>Next ›</button></nav>`;
  const go = j => { location.hash = "q=" + (j + 1); };
  $("prevB").onclick = () => go(i - 1); $("nextB").onclick = () => go(i + 1); $("listB").onclick = () => { location.hash = ""; };
  $("side").onclick = e => { const b = e.target.closest("[data-j]"); if (b) { document.body.classList.remove("grid-open"); go(+b.dataset.j); } };
  $("gridBtn").onclick = () => document.body.classList.add("grid-open"); $("ov").onclick = () => document.body.classList.remove("grid-open");
  $("bm").onclick = () => { bms.has(i) ? bms.delete(i) : bms.add(i); try { const a = JSON.parse(SSC.store.get("ssc-bm", "{}")); a[KEY] = [...bms]; SSC.store.set("ssc-bm", JSON.stringify(a)); } catch (e) {}
    fetch("/api/me/saved", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ test: KEY, q: i, on: bms.has(i) }) }).catch(() => {}); drawQ(); };
  // reattempt this one question (practice only – your score and rank don't change)
  const rs = $("rStart"); if (rs) rs.onclick = () => { retry[i] = { ...(retry[i] || {}), on: true, pick: null }; saveRetry(); drawQ(); };
  if (inRetry && R.pick == null) { $("ops").onclick = e => { const b = e.target.closest("[data-k]"); if (!b) return; R.pick = +b.dataset.k; R.last = R.pick === q.a; saveRetry(); drawQ(); }; $("rCancel").onclick = () => { R.on = false; saveRetry(); drawQ(); }; }
  if ($("rAgain")) $("rAgain").onclick = () => { R.pick = null; saveRetry(); drawQ(); };
  if ($("rDone")) $("rDone").onclick = () => { R.on = false; R.pick = null; saveRetry(); drawQ(); };
  fitPanes(); $("qcard").scrollTop = 0;
  const onq = $("side").querySelector(".on"); if (onq) onq.scrollIntoView({ block: "nearest" });
  // swipe left / right on phones
  let sx = null, sy = 0; const qc = $("qcard");
  qc.addEventListener("touchstart", e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
  qc.addEventListener("touchend", e => { if (sx == null) return; const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; sx = null;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) { if (dx < 0 && i < Q.length - 1) go(i + 1); if (dx > 0 && i > 0) go(i - 1); } });
  math($("main"));
}
// question and palette each scroll on their own (computer screens)
function fitPanes() { const v = document.querySelector(".qview"), nb = document.querySelector(".navb"); if (!v) return;
  const h = innerHeight - v.getBoundingClientRect().top - window.scrollY - (nb ? nb.offsetHeight : 0) - 14; v.style.setProperty("--qh", Math.max(360, h) + "px"); }
addEventListener("resize", fitPanes);
document.addEventListener("keydown", e => { if (!/q=/.test(location.hash) || /INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
  if (e.key === "ArrowRight" && cur < Q.length - 1) location.hash = "q=" + (cur + 2); if (e.key === "ArrowLeft" && cur > 0) location.hash = "q=" + cur; });
load();
}
</script>
</body>
</html>
