<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- ssc-build 2/7 dGg= -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Tests – SSCAspirants_Official</title>
<meta name="description" content="Mock tests on the latest Eduquity CBT pattern, chapter-wise notes and previous year papers for SSC CGL, CHSL, MTS, GD, CPO and more.">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/site.css">

<script>try{document.documentElement.dataset.read=localStorage.getItem("ssc-read")==="dark"?"dark":"light";document.documentElement.style.setProperty("--scale",localStorage.getItem("ssc-scale")||1)}catch(e){}</script>
</head>
<body data-page="live" data-title="Live Tests">
<main id="content" class="content">
<style>
.live{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.live .card{display:flex;flex-direction:column;gap:10px}
.live .pill{align-self:flex-start}
.live .meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:.92rem}
.ldot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px;box-shadow:0 0 0 4px var(--ok-soft);animation:pulse 1.8s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 7px transparent}}
</style>
<section><div class="sec-head"><h2>Live tests</h2><a href="mock-tests.html">All mock tests →</a></div>
<div class="live" id="liveTests"></div></section>
</main>
<script src="data/subjects.js"></script>
<script src="data/exams.js"></script>
<script src="data/live-tests.js"></script>
<script src="data/tests.js"></script>
<script src="data/notes.js"></script>
<script src="data/site.js"></script>
<script src="assets/site.js"></script>
<script>
{
const E=SSC.esc, L=window.LIVE_TESTS||[];
document.getElementById("liveTests").innerHTML=L.length?L.map(t=>`<div class="card" data-tcard="${E((/[?&]id=([^&]+)/.exec(t.link)||[,"polity-ch1-4"])[1])}" data-title="${E(t.name)}"><span class="pill ok"><span class="ldot"></span>Live now</span>
<b style="font-size:1.08rem">${E(t.name)}</b><div class="meta"><span>${E(t.type)}</span><span>${E(t.exams)}</span></div>
<div class="meta"><span>${t.questions} questions</span><span>${t.minutes} min</span><span>${E(t.marking)}</span></div>
<a class="btn btn-pri" href="${t.link}">Start test</a></div>`).join(""):`<p class="muted">New live tests are coming soon.</p>`;
if(window.SSCTestCards) SSCTestCards();
}
</script>
</body>
</html>
