<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Account details – SSCAspirants_Official</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/site.css">

<script>try{document.documentElement.dataset.read=localStorage.getItem("ssc-read")==="dark"?"dark":"light";document.documentElement.style.setProperty("--scale",localStorage.getItem("ssc-scale")||1)}catch(e){}</script>
</head>
<body data-page="account" data-title="Account details">
<main id="content" class="content">
<style>
.acct{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
.prof{display:flex;gap:16px;align-items:center}
.prof .big{width:88px;height:88px;overflow:hidden;border-radius:50%;display:grid;place-items:center;background:var(--pri);color:var(--pri-ink);font:700 1.6rem "Poppins",sans-serif;border:3px solid var(--gold);flex:none}
.prof .big img{width:100%;height:100%;object-fit:cover;display:block}
.phbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn-sm{min-height:36px;padding:6px 14px;font-size:.9rem}
.prof h2{margin:0;font-size:1.25rem}
.prof p{margin:2px 0 0;color:var(--muted);word-break:break-all}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:18px 0 0;font-size:.95rem}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600}
.fl{display:grid;gap:6px;margin-bottom:12px;font-weight:600;font-size:.95rem}
.fl input{min-height:46px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:400 16px "Inter",sans-serif;padding:0 14px}
.amsg{display:none;border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:.95rem}
.amsg.show{display:block}.amsg.err{background:#FDECEA;color:#B42318}.amsg.ok{background:#E8F5EC;color:#1E7A3C}
.res{display:grid;gap:10px}
.res .row .sc{font:700 1.05rem "Poppins",sans-serif;color:var(--pri);margin-left:auto;white-space:nowrap}
.wide{grid-column:1/-1}
@media (max-width:820px){.acct{grid-template-columns:1fr}}
</style>
<div class="acct">
  <section class="card">
    <div class="prof"><div class="big" id="aBig">?</div><div><h2 id="aName">Loading…</h2><p id="aEmail"></p>
      <div class="phbtns"><label class="btn btn-out btn-sm" for="phFile" style="cursor:pointer">Change photo</label><input id="phFile" type="file" accept="image/*" hidden>
      <button class="btn btn-out btn-sm" type="button" id="phDel" hidden>Remove photo</button></div></div></div>
    <div class="amsg" id="phMsg" role="alert" style="margin-top:12px"></div>
    <dl class="kv"><dt>Signs in with</dt><dd id="aWay">–</dd><dt>Account type</dt><dd id="aRole">–</dd><dt>Daily quiz</dt><dd id="aStreak">–</dd></dl>
    <div class="bar" style="margin-top:18px;display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn btn-out" type="button" id="aOut">Log out</button>
    </div>
  </section>
  <section class="card">
    <div class="sec-head"><h2 id="pwHead">Change password</h2></div>
    <div class="amsg" id="pwMsg" role="alert"></div>
    <form id="pwForm" novalidate>
      <label class="fl" id="curRow">Current password<input id="pwCur" type="password" autocomplete="current-password"></label>
      <label class="fl">New password<input id="pwNew" type="password" autocomplete="new-password" minlength="8"></label>
      <label class="fl">Confirm new password<input id="pwNew2" type="password" autocomplete="new-password"></label>
      <button class="btn btn-pri" type="submit">Save password</button>
    </form>
  </section>
  <section class="card wide">
    <div class="sec-head"><h2>My results</h2><p>Your last 50 test attempts</p></div>
    <div class="res" id="aRes"><p class="muted">Loading…</p></div>
  </section>
</div>
</main>
<script src="data/subjects.js"></script>
<script src="data/exams.js"></script>
<script src="data/tests.js"></script>
<script src="data/site.js"></script>
<script src="assets/site.js"></script>
<script>
(function () {
  const $ = id => document.getElementById(id), E = SSC.esc;
  const big = u => { $("aBig").innerHTML = u.photo ? `<img src="/api/me/photo?v=${u.photo}" alt="Your photo">` : E((u.name || u.email).charAt(0).toUpperCase()); $("phDel").hidden = !u.photo; };
  let me = null;
  const show = d => {
    const u = d.user;
    if (!u) { $("aName").textContent = d.admin ? "You're logged in as an admin" : "Not logged in"; $("aEmail").textContent = d.admin ? "Account details are for student accounts." : ""; return; }
    me = u; big(u);
    $("aName").textContent = u.name; $("aEmail").textContent = u.email;
    $("aWay").textContent = [u.password ? "Email and password" : "", u.google ? "Google" : ""].filter(Boolean).join(" + ") || "–";
    $("aRole").textContent = "Student";
    if (!u.password) { $("curRow").hidden = true; $("pwHead").textContent = "Add a password"; }
  };
  if (window.SSC.user !== undefined) show({ user: SSC.user, admin: SSC.admin }); else document.addEventListener("ssc:user", e => show(e.detail));

  // profile photo: cut to a square, shrink to 256×256, send as a small JPG
  const pm = (t, k) => { const m = $("phMsg"); m.textContent = t; m.className = "amsg show " + k; };
  $("phFile").addEventListener("change", async () => {
    const f = $("phFile").files[0]; $("phFile").value = ""; if (!f || !me) return;
    if (!/^image\//.test(f.type)) return pm("Please choose a picture.", "err");
    try {
      const img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => no(new Error("Couldn't open that picture.")); i.src = URL.createObjectURL(f); });
      const s = Math.min(img.naturalWidth, img.naturalHeight), c = document.createElement("canvas"); c.width = c.height = 256;
      const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, 256, 256);
      x.drawImage(img, (img.naturalWidth - s) / 2, (img.naturalHeight - s) / 2, s, s, 0, 0, 256, 256);
      URL.revokeObjectURL(img.src);
      pm("Saving photo…", "ok");
      const r = await fetch("/api/me/photo", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ photo: c.toDataURL("image/jpeg", 0.85) }) });
      const d = await r.json().catch(() => ({})); if (!r.ok) throw new Error(d.error || "Couldn't save the photo.");
      me.photo = d.photo; big(me); SSC.paintAvatar(me); pm("Photo saved.", "ok");
    } catch (err) { pm(err.message, "err"); }
  });
  $("phDel").addEventListener("click", async () => {
    try { const r = await fetch("/api/me/photo", { method: "DELETE" }); if (!r.ok) throw new Error("Couldn't remove the photo.");
      me.photo = 0; big(me); SSC.paintAvatar(me); pm("Photo removed.", "ok"); } catch (err) { pm(err.message, "err"); }
  });
  $("aOut").addEventListener("click", () => SSC.logout());

  const say = (t, k) => { const m = $("pwMsg"); m.textContent = t; m.className = "amsg show " + k; };
  $("pwForm").addEventListener("submit", async e => {
    e.preventDefault();
    const pw = $("pwNew").value;
    if (pw.length < 8) return say("New password must be at least 8 characters.", "err");
    if (pw !== $("pwNew2").value) return say("The two new passwords don't match.", "err");
    try {
      const r = await fetch("/api/auth/password", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ current: $("pwCur").value, password: pw }) });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.error || "Could not save. Please try again.");
      say("Password saved.", "ok"); $("pwForm").reset(); $("curRow").hidden = false; $("pwHead").textContent = "Change password";
    } catch (err) { say(err.message, "err"); }
  });

  fetch("/api/daily").then(r => r.json()).then(d => { $("aStreak").textContent = `🔥 ${d.streak}-day streak · best ${d.best} · ${d.played} done`; }).catch(() => {});
  const T = window.TESTS || {};
  const day = t => new Date(t).toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" });
  fetch("/api/me/attempts").then(r => r.json()).then(d => {
    const a = d.attempts || [];
    $("aRes").innerHTML = a.length ? a.map(x => {
      const t = T[x.test], name = t ? t.title : x.test === "polity-ch1-4" ? "Indian Polity – Chapter Test" : x.test;
      const link = t ? "test.html?id=" + encodeURIComponent(x.test) : "test.html";
      const nth = n => n + (n % 100 >= 11 && n % 100 <= 13 ? "th" : ["th", "st", "nd", "rd"][n % 10] || "th");
      return `<div class="row"><div class="t"><b>${E(name)}</b><span>${day(x.created)}${x.n ? " · " + nth(x.n) + " attempt" : ""}${x.rank ? " · Rank " + x.rank + " / " + x.total + (x.n > 1 ? " (would be)" : "") : ""}</span></div>
        <span class="sc">${+(+x.score).toFixed(2)}${x.max ? " / " + x.max : ""}</span><a class="btn btn-out" href="solutions.html?id=${encodeURIComponent(x.test)}${x.n ? "&n=" + x.n : ""}">Solutions</a><a class="btn btn-out" href="${link}">Retake</a></div>`;
    }).join("") : `<p class="muted">No tests yet.</p>`;
  }).catch(() => { $("aRes").innerHTML = `<p class="muted">Results show here on the live website.</p>`; });
})();
</script>
</body>
</html>
