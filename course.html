<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Course – SSCAspirants_Official</title>
<meta name="description" content="Course lessons: video lectures, live classes, notes, PDFs and tests.">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#141B38"><link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/site.css">

<script>try{document.documentElement.dataset.read=localStorage.getItem("ssc-read")==="dark"?"dark":"light";document.documentElement.style.setProperty("--scale",localStorage.getItem("ssc-scale")||1)}catch(e){}</script>
</head>
<body data-page="courses" data-title="Course">
<main id="content" class="content">
<style>
.cgrid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.ccard{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);color:var(--ink);transition:transform .15s,border-color .15s}
.ccard:hover{transform:translateY(-3px);border-color:var(--pri);text-decoration:none}
.ccov{position:relative;padding:20px;color:#fff;min-height:128px;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;background:var(--c,#1F3A93)}
.ccov::after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:#ffffff1a}
.ccov b{font:700 1.15rem/1.3 Poppins,sans-serif;position:relative;z-index:1}
.ccov .tag{align-self:flex-start;background:#ffffff26;border:1px solid #ffffff40;border-radius:999px;padding:2px 10px;font-size:.78rem;font-weight:700;position:relative;z-index:1}
.cbody{padding:16px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
.cmeta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:.9rem}
.price{display:flex;align-items:baseline;gap:8px;margin-top:auto}
.price b{font:700 1.3rem Poppins,sans-serif;color:var(--ink)}.price s{color:var(--muted)}.price .off{color:var(--ok);font-weight:700;font-size:.88rem}
.free{color:var(--ok)!important}
.ftabs{display:flex;gap:8px;flex-wrap:wrap}
.ftabs button{min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600}
.ftabs button[aria-pressed="true"]{background:var(--pri);color:#fff;border-color:var(--pri)}
</style><style>
.chero{border-radius:22px;padding:clamp(20px,4vw,36px);color:#fff;background:var(--c,#1F3A93);display:flex;flex-wrap:wrap;gap:20px;align-items:flex-end;box-shadow:0 16px 36px rgba(20,27,56,.22);position:relative;overflow:hidden}
.chero::after{content:"";position:absolute;right:-70px;top:-70px;width:240px;height:240px;border-radius:50%;background:#ffffff14}
.chero .t{flex:999 1 360px;position:relative;z-index:1}.chero h2{font-size:clamp(1.5rem,3vw,2.1rem);color:#fff;margin:6px 0}
.chero p{margin:0;color:#E6EBFF}.chero .buy{flex:1 1 220px;position:relative;z-index:1;background:#fff;color:#1E2433;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.chero .tag{display:inline-block;background:#ffffff26;border:1px solid #ffffff40;border-radius:999px;padding:2px 10px;font-size:.8rem;font-weight:700}
.cl{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
@media(max-width:960px){.cl{grid-template-columns:1fr}}
.player{background:#0C1222;border-radius:16px;overflow:hidden;aspect-ratio:16/9;display:grid;place-items:center;color:#C9D3FF;text-align:center;padding:0}
.player iframe{width:100%;height:100%;border:0}
.player .msg{padding:24px;display:flex;flex-direction:column;gap:12px;align-items:center}
.lhead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}.lhead h3{margin:0;margin-right:auto;font:700 1.15rem Poppins,sans-serif}
.chap{border:1px solid var(--line);border-radius:14px;background:var(--surface);margin-bottom:10px;overflow:hidden}
.chap>summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;gap:10px;align-items:center;font-weight:700}
.chap>summary::-webkit-details-marker{display:none}.chap>summary small{margin-left:auto;color:var(--muted);font-weight:500}
.les{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:transparent;color:var(--ink);padding:10px 14px;font:inherit}
.les:hover{background:var(--pri-soft)}.les[aria-current="true"]{background:var(--pri-soft);box-shadow:inset 3px 0 0 var(--pri)}
.les .ic{flex:none;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--bg);font-size:1rem}
.les .tt{flex:1;min-width:0}.les .tt small{display:block;color:var(--muted);font-size:.8rem}
.les .st{flex:none;font-size:.9rem}
.les.done .ic{background:var(--ans);color:#fff}
.ltabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.ltabs button{min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600}
.ltabs button[aria-pressed="true"]{background:var(--pri);color:#fff;border-color:var(--pri)}
.live-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.live-row:last-child{border-bottom:0}
.live-row time{flex:none;font-weight:700;color:var(--acc);min-width:150px}
.cprog{height:8px;border-radius:6px;background:var(--line);overflow:hidden}.cprog i{display:block;height:100%;background:var(--ans)}
</style>
<section data-dyn="1" id="cwrap"><p class="muted">Loading…</p></section>
</main>
<script src="data/subjects.js"></script>
<script src="data/exams.js"></script>
<script src="data/notes.js"></script>
<script src="data/tests.js"></script>
<script src="data/courses.js"></script>
<script src="data/site.js"></script>
<script src="assets/site.js"></script>
<script src="assets/doubts.js"></script>
<script src="assets/courses.js"></script>
<script>CourseKit.page(document.getElementById("cwrap"));</script>
</body>
</html>
