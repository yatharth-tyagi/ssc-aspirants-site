<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leaderboard – SSCAspirants_Official</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/site.css">

<script>try{document.documentElement.dataset.read=localStorage.getItem("ssc-read")==="dark"?"dark":"light";document.documentElement.style.setProperty("--scale",localStorage.getItem("ssc-scale")||1)}catch(e){}</script>
</head>
<body data-page="leaderboard" data-title="Leaderboard">
<main id="content" class="content">
<style>
.lb-top{display:flex;flex-wrap:wrap;gap:12px;align-items:end;margin-bottom:16px}
.lb-top label{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:.9rem}
.lb-top select{min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit;padding:0 12px;min-width:260px}
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:16px;align-items:end}
.pod{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 10px;text-align:center}
.pod .av{width:64px;height:64px;margin:0 auto 8px;border-radius:50%;display:grid;place-items:center;background:var(--pri);color:var(--pri-ink);font:700 1.4rem "Poppins",sans-serif;overflow:hidden;border:3px solid var(--gold)}
.pod .av img{width:100%;height:100%;object-fit:cover}
.pod b{display:block;overflow-wrap:anywhere}.pod .sc{font:700 1.2rem "Poppins",sans-serif;color:var(--pri)}
.pod.p1{order:2;padding-top:26px;border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}.pod.p2{order:1}.pod.p3{order:3}
.pod .medal{font-size:1.6rem}
.lbt{width:100%;border-collapse:collapse}
.lbt td,.lbt th{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left}
.lbt th{font-size:.76rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.lbt td:last-child,.lbt th:last-child{text-align:right}
.lbt tr.me td{background:var(--pri-soft);font-weight:700}
.lbt .mini{width:34px;height:34px;border-radius:50%;display:inline-grid;place-items:center;background:var(--pri);color:var(--pri-ink);font-weight:700;overflow:hidden;vertical-align:middle;margin-right:10px}
.lbt .mini img{width:100%;height:100%;object-fit:cover}
@media(max-width:560px){.podium{grid-template-columns:1fr}.pod.p1,.pod.p2,.pod.p3{order:0}}
</style>
<section><div class="sec-head"><h2>Leaderboard</h2><p>Top students of each test (1st attempt only)</p></div>
<div class="lb-top"><label for="lbTest">Test<select id="lbTest"></select></label></div>
<div id="lbBody" data-dyn><p class="muted">Loading…</p></div></section>
</main>
<script src="data/subjects.js"></script>
<script src="data/exams.js"></script>
<script src="data/tests.js"></script>
<script src="data/site.js"></script>
<script src="assets/site.js"></script>
<script>
(function () {
  const $ = id => document.getElementById(id), E = SSC.esc;
  const T = window.TESTS || {}, list = [...Object.entries(T).map(([id, t]) => [id, t.title]), ["polity-ch1-4", "Indian Polity – Chapters 1 to 4"]];
  const want = new URLSearchParams(location.search).get("test");
  $("lbTest").innerHTML = list.map(([id, n]) => `<option value="${E(id)}"${id === want ? " selected" : ""}>${E(n)}</option>`).join("");
  const av = r => `<span class="${"av"}">${r.photo ? `<img src="${E(r.photo)}" alt="">` : E((r.name || "?").charAt(0).toUpperCase())}</span>`;
  const mini = r => `<span class="mini">${r.photo ? `<img src="${E(r.photo)}" alt="">` : E((r.name || "?").charAt(0).toUpperCase())}</span>`;
  async function draw() {
    const id = $("lbTest").value; history.replaceState(null, "", "?test=" + encodeURIComponent(id));
    try { const r = await fetch("/api/leaderboard?test=" + encodeURIComponent(id)); const d = await r.json(); if (!r.ok) throw new Error(d.error);
      if (!d.list.length) { $("lbBody").innerHTML = `<div class="card"><p class="muted" style="margin:0">No one has taken this test yet. Be the first! <a href="test.html${id === "polity-ch1-4" ? "" : "?id=" + encodeURIComponent(id)}">Start the test</a></p></div>`; return; }
      const top = d.list.slice(0, 3), medals = ["🥇", "🥈", "🥉"];
      $("lbBody").innerHTML = `<div class="podium">${top.map((x, i) => `<div class="pod p${i + 1}"><div class="medal">${medals[i]}</div>${av(x)}<b>${E(x.name)}</b><span class="sc">${+(+x.score).toFixed(2)}</span><span class="muted"> / ${x.max}</span></div>`).join("")}</div>
        ${d.mine ? `<p class="card" style="margin:0 0 14px">Your rank: <b>${d.mine.rank}</b> of ${d.total} · score <b>${+(+d.mine.score).toFixed(2)}</b> / ${d.mine.max}</p>` : ""}
        <div class="card" style="padding:6px 8px;overflow-x:auto"><table class="lbt"><thead><tr><th>Rank</th><th>Student</th><th>Score</th></tr></thead><tbody>
        ${d.list.map(x => `<tr class="${x.me ? "me" : ""}"><td>${x.rank}</td><td>${mini(x)}${E(x.name)}${x.me ? " (you)" : ""}</td><td>${+(+x.score).toFixed(2)} / ${x.max}</td></tr>`).join("")}</tbody></table></div>
        <p class="muted">${d.total} students took this test.</p>`;
    } catch (e) { $("lbBody").innerHTML = `<p class="muted">The leaderboard shows on the live website.</p>`; }
  }
  $("lbTest").onchange = draw; draw();
})();
</script>
</body>
</html>
