<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Docs editor – SSCAspirants_Official</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600;700&family=Hind:wght@400;500;600;700&family=Merriweather:wght@400;700&display=swap">
<link rel="stylesheet" href="assets/site.css">
<link rel="stylesheet" href="assets/reader.css">
<script>try{document.documentElement.dataset.read=localStorage.getItem("ssc-read")==="dark"?"dark":"light"}catch(e){}</script>
<style>
body{display:flex;flex-direction:column;min-height:100vh;margin:0;background:var(--bg)}
.dbar{position:sticky;top:0;z-index:30}
.dtop{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 14px;background:var(--side);color:#fff}
.dtop img{width:34px;height:34px;border-radius:50%;border:2px solid #F5C451}
.dtop input{flex:1 1 220px;min-width:0;min-height:38px;border-radius:9px;border:1px solid #ffffff40;background:#ffffff14;color:#fff;font:600 1rem "Poppins",sans-serif;padding:0 12px}
.eb{min-height:38px;padding:0 12px;border-radius:9px;border:1px solid #ffffff40;background:transparent;color:#fff;font:600 .86rem Inter,sans-serif;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.eb:hover{background:#ffffff1a}.eb.gold{background:#F5C451;color:#141B38;border-color:#F5C451}
.dstat{font-size:.82rem;color:#C9D3FF}
.tools{display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding:6px 12px;background:var(--surface);border-bottom:1px solid var(--line)}
.tools .sep{width:1px;height:26px;background:var(--line);margin:0 4px}
.tb{min-width:34px;height:34px;padding:0 8px;border-radius:7px;border:1px solid transparent;background:transparent;color:var(--ink);font:600 .9rem Inter,sans-serif;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.tb:hover{background:var(--pri-soft);border-color:var(--line)}
.tb[aria-pressed="true"]{background:var(--pri);color:var(--pri-ink)}
.tools select{height:34px;border-radius:7px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:500 .86rem Inter,sans-serif;padding:0 6px}
.clr{position:relative;display:inline-flex}
.clr input{position:absolute;inset:0;opacity:0;cursor:pointer}
.clr .tb span{border-bottom:4px solid var(--c,#C00);line-height:1}
.ctx{display:none;flex-wrap:wrap;gap:4px;align-items:center;padding:6px 12px;background:var(--gold-soft);border-bottom:1px solid var(--line);font-size:.85rem}
.ctx.show{display:flex}
.page-wrap{flex:1;overflow:auto;padding:26px 14px 60px}
#page{max-width:820px;margin:0 auto;background:#fff;color:#1E2433;min-height:1060px;padding:64px 72px;box-sizing:border-box;box-shadow:0 4px 24px rgba(20,27,56,.14);border-radius:4px;outline:none;font:400 16px/1.7 Inter,"Hind",sans-serif}
[data-read="dark"] #page{background:#151D33;color:#E6EAF3}
#page:empty::before{content:"Start typing your notes here…";color:#999}
#page img{max-width:100%;height:auto;cursor:pointer}
#page img.sel{outline:3px solid #2F6BFF}
#page table{border-collapse:collapse;width:100%;margin:12px 0}
#page td,#page th{border:1px solid #CFC7B5;padding:8px 10px;vertical-align:top;min-width:40px}
#page th{background:#EEF2FC;font-weight:700}
#page hr{border:0;border-top:2px solid #E9E2D2;margin:20px 0}
#page blockquote{border-left:4px solid #C9962E;margin:12px 0;padding:6px 16px;background:#FBF1DC66}
.wc{position:fixed;right:14px;bottom:12px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:.82rem;color:var(--muted);box-shadow:var(--shadow)}
.banner{display:none;gap:10px;align-items:center;padding:8px 14px;background:var(--gold-soft);font-size:.9rem;flex-wrap:wrap}.banner.show{display:flex}
dialog{border:1px solid var(--line);border-radius:16px;padding:22px;background:var(--surface);color:var(--ink);max-width:min(520px,calc(100vw - 32px));width:100%;box-sizing:border-box}
dialog::backdrop{background:rgba(10,14,30,.55)}
dialog label{display:flex;flex-direction:column;gap:6px;font-weight:600;margin-bottom:12px}
dialog select,dialog input[type=text],dialog input[type=number]{min-height:42px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;padding:0 10px}
.ck{flex-direction:row!important;align-items:center;gap:10px!important}.ck input{width:20px;height:20px}
.tpick{display:grid;grid-template-columns:repeat(8,22px);gap:3px;margin:8px 0}
.tpick i{width:22px;height:22px;border:1px solid var(--line);border-radius:3px;background:var(--bg)}
.tpick i.on{background:var(--pri-soft);border-color:var(--pri)}
@media(max-width:700px){#page{padding:28px 18px;min-height:70vh}.tools{overflow-x:auto;flex-wrap:nowrap}}
@media print{.dbar,.wc,.banner{display:none!important}#page{box-shadow:none;padding:0;max-width:none}}
</style>
</head>
<body data-shell="off">
<div class="dbar">
  <div class="dtop">
    <a class="eb" href="admin.html#notes">← Admin</a><img src="assets/logo.png" alt="">
    <input id="title" placeholder="Chapter title" maxlength="140" aria-label="Chapter title">
    <button class="eb" type="button" id="importBtn">Import Word</button><input type="file" id="docxFile" accept=".docx" hidden>
    <button class="eb" type="button" id="printBtn">PDF</button>
    <button class="eb" type="button" id="saveBtn">Save draft</button>
    <button class="eb gold" type="button" id="pubBtn">Publish</button>
    <span class="dstat" id="stat"></span>
  </div>
  <div class="tools" role="toolbar" aria-label="Formatting">
    <button class="tb" data-c="undo" title="Undo (Ctrl+Z)">↶</button><button class="tb" data-c="redo" title="Redo (Ctrl+Y)">↷</button><span class="sep"></span>
    <select id="style" title="Style"><option value="p">Normal text</option><option value="h2">Heading 1</option><option value="h3">Heading 2</option><option value="h4">Heading 3</option><option value="blockquote">Quote</option></select>
    <select id="font" title="Font"><option value="">Font</option><option value="Inter">Inter</option><option value="Poppins">Poppins</option><option value="Hind">Hind (हिन्दी)</option><option value="Merriweather">Merriweather</option><option value="Georgia">Georgia</option><option value="Courier New">Courier</option></select>
    <select id="size" title="Text size"><option value="">Size</option><option>12</option><option>14</option><option>16</option><option>18</option><option>20</option><option>24</option><option>28</option><option>32</option><option>40</option></select><span class="sep"></span>
    <button class="tb" data-c="bold" title="Bold (Ctrl+B)"><b>B</b></button><button class="tb" data-c="italic" title="Italic (Ctrl+I)"><i>I</i></button><button class="tb" data-c="underline" title="Underline (Ctrl+U)"><u>U</u></button><button class="tb" data-c="strikeThrough" title="Strikethrough"><s>S</s></button>
    <button class="tb" data-c="superscript" title="Superscript">x²</button><button class="tb" data-c="subscript" title="Subscript">x₂</button>
    <span class="clr" title="Text colour"><button class="tb" type="button" tabindex="-1"><span id="fcS" style="--c:#C0392B">A</span></button><input type="color" id="fc" value="#c0392b"></span>
    <span class="clr" title="Highlight"><button class="tb" type="button" tabindex="-1"><span id="hcS" style="--c:#FFE066">▇</span></button><input type="color" id="hc" value="#ffe066"></span><span class="sep"></span>
    <button class="tb" data-c="justifyLeft" title="Align left">⯇</button><button class="tb" data-c="justifyCenter" title="Centre">≡</button><button class="tb" data-c="justifyRight" title="Align right">⯈</button><button class="tb" data-c="justifyFull" title="Justify">☰</button><span class="sep"></span>
    <button class="tb" data-c="insertUnorderedList" title="Bullets">•≡</button><button class="tb" data-c="insertOrderedList" title="Numbers">1.</button><button class="tb" data-c="outdent" title="Decrease indent">⇤</button><button class="tb" data-c="indent" title="Increase indent">⇥</button><span class="sep"></span>
    <button class="tb" data-c="link" title="Link">🔗</button><button class="tb" data-c="image" title="Picture">🖼</button><input type="file" id="imgFile" accept="image/*" hidden><button class="tb" data-c="table" title="Table">▦</button><button class="tb" data-c="hr" title="Line">―</button>
    <select id="box" title="Special box"><option value="">Box…</option><option value="info">ℹ Note box</option><option value="trick">💡 Memory trick</option><option value="imp">⚠ Important</option><option value="exam">🎯 Asked in exam</option></select>
    <button class="tb" data-c="removeFormat" title="Clear formatting">⨯A</button><button class="tb" data-c="find" title="Find and replace (Ctrl+H)">🔍</button>
  </div>
  <div class="ctx" id="tblBar"><b>Table:</b><button class="tb" data-t="rowA">＋ Row above</button><button class="tb" data-t="rowB">＋ Row below</button><button class="tb" data-t="colL">＋ Column left</button><button class="tb" data-t="colR">＋ Column right</button><button class="tb" data-t="delRow">− Row</button><button class="tb" data-t="delCol">− Column</button><button class="tb" data-t="head">Heading row</button><button class="tb" data-t="delTbl">Delete table</button></div>
  <div class="ctx" id="imgBar"><b>Picture:</b><button class="tb" data-i="25">25%</button><button class="tb" data-i="50">50%</button><button class="tb" data-i="75">75%</button><button class="tb" data-i="100">100%</button><button class="tb" data-i="left">Left</button><button class="tb" data-i="center">Centre</button><button class="tb" data-i="right">Right</button><button class="tb" data-i="del">Delete</button></div>
  <div class="ctx" id="findBar"><input id="fFind" placeholder="Find" style="height:32px;border:1px solid var(--line);border-radius:7px;padding:0 8px"><input id="fRep" placeholder="Replace with" style="height:32px;border:1px solid var(--line);border-radius:7px;padding:0 8px"><button class="tb" id="fNext">Find next</button><button class="tb" id="fOne">Replace</button><button class="tb" id="fAll">Replace all</button><span id="fMsg"></span><button class="tb" id="fClose">✕</button></div>
  <div class="banner" id="restore"><b>Unsaved writing from earlier was found on this device.</b><button class="tb" type="button" id="restoreYes" style="background:#fff">Restore it</button><button class="tb" type="button" id="restoreNo" style="background:#fff">Discard</button></div>
</div>
<div class="page-wrap"><article id="page" class="doc" contenteditable="true" spellcheck="true"></article></div>
<div class="wc" id="wc">0 words</div>

<dialog id="pubDlg">
  <h2 style="margin-top:0">Publish notes</h2>
  <label>Subject<select id="pSub"></select></label>
  <label>Chapter<select id="pChap"></select></label>
  <label id="pNewWrap" hidden>New chapter title<input type="text" id="pNew" maxlength="140"></label>
  <label>Short line under the title<input type="text" id="pDesc" maxlength="160"></label>
  <label>Reading time<input type="text" id="pRead" placeholder="10 min read" maxlength="30"></label>
  <label>Exam tags (commas)<input type="text" id="pExams" placeholder="SSC CGL, CHSL, MTS"></label>
  <label class="ck"><input type="checkbox" id="pPdf"> Allow students to download PDF</label>
  <p class="muted" id="pMsg" style="margin:0 0 10px"></p>
  <div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn btn-out" type="button" id="pCancel">Cancel</button><button class="btn btn-pri" type="button" id="pGo">Publish</button></div>
</dialog>
<dialog id="tblDlg"><h2 style="margin-top:0">Insert table</h2><div class="tpick" id="tpick"></div><p id="tsz" style="margin:0 0 12px">3 × 3</p>
  <div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn btn-out" type="button" id="tCancel">Cancel</button></div></dialog>

<script src="assets/site.js"></script>
<script>
(function () {
const $ = id => document.getElementById(id), E = SSC.esc, page = $("page");
const qs = new URLSearchParams(location.search);
let cid = qs.get("ch") || "", dirty = false, NOTES = {}, SUBS = [];
const DRAFT = () => "ssc-doc-draft:" + (cid || "new");
const stat = t => $("stat").textContent = t;
document.execCommand("styleWithCSS", false, true);
document.execCommand("defaultParagraphSeparator", false, "p");

// ---------- GitHub (admins only, through /api/gh) ----------
const gh = async (path, opt = {}) => { const r = await fetch("/api/gh" + path, { cache: "no-store", ...opt, headers: { Accept: "application/vnd.github+json", ...(opt.headers || {}) } });
  if (!r.ok) { const t = await r.text(); let m = t; try { m = JSON.parse(t).message || t; } catch (e) {} const er = new Error(r.status + " " + m); er.status = r.status; throw er; } return r; };
const readRaw = async p => { try { return await (await gh(`/contents/${p}?ref=main`, { headers: { Accept: "application/vnd.github.raw+json" } })).text(); } catch (e) { if (e.status === 404) return null; throw e; } };
const b64 = bytes => { let s = ""; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(s); };
const write = async (p, base64, msg) => { let sha = null; try { sha = (await (await gh(`/contents/${p}?ref=main&meta=1`)).json()).sha; } catch (e) {}
  const body = { message: msg, content: base64, branch: "main" }; if (sha) body.sha = sha; await gh(`/contents/${p}`, { method: "PUT", body: JSON.stringify(body), headers: { "Content-Type": "application/json" } }); };
const readData = async (p, name, fb) => { const code = await readRaw(p); if (code == null) return fb; const w = {}; new Function("window", code)(w); return w[name] === undefined ? fb : w[name]; };
const writeData = (p, name, v, note) => write(p, b64(new TextEncoder().encode(`// ${note}\n// Saved from the admin page on ${new Date().toISOString().slice(0, 10)}.\nwindow.${name} = ${JSON.stringify(v, null, 1)};\n`)), "Admin: update " + p);
const slug = t => String(t).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 60) || "chapter";

// keep only safe HTML (no scripts, no event handlers)
function safe(html) {
  const doc = new DOMParser().parseFromString(html || "", "text/html");
  doc.querySelectorAll("script,iframe,object,embed,style,link,meta,form,base,input,button").forEach(x => x.remove());
  doc.querySelectorAll("*").forEach(el => [...el.attributes].forEach(a => { const v = a.value.trim().toLowerCase();
    if (a.name.startsWith("on") || a.name === "contenteditable" || ((a.name === "href" || a.name === "src") && (v.startsWith("javascript:") || (v.startsWith("data:") && !v.startsWith("data:image/"))))) el.removeAttribute(a.name); }));
  doc.querySelectorAll("font").forEach(f => { const s = doc.createElement("span"); if (f.face) s.style.fontFamily = f.face; if (f.color) s.style.color = f.color; s.innerHTML = f.innerHTML; f.replaceWith(s); });
  doc.querySelectorAll("img.sel").forEach(i => i.classList.remove("sel"));
  return doc.body.innerHTML;
}

// ---------- toolbar ----------
const exec = (c, v) => { page.focus(); restoreSel(); document.execCommand(c, false, v); changed(); paintState(); };
let savedRange = null;
document.addEventListener("selectionchange", () => { const s = getSelection(); if (s.rangeCount && page.contains(s.anchorNode)) { savedRange = s.getRangeAt(0).cloneRange(); paintState(); ctx(); } });
const restoreSel = () => { if (!savedRange) return; const s = getSelection(); if (s.rangeCount && page.contains(s.anchorNode)) return; s.removeAllRanges(); s.addRange(savedRange); };
function paintState() {
  ["bold", "italic", "underline", "strikeThrough", "superscript", "subscript", "insertUnorderedList", "insertOrderedList", "justifyLeft", "justifyCenter", "justifyRight", "justifyFull"].forEach(c => {
    const b = document.querySelector(`.tb[data-c="${c}"]`); if (b) { let st = false; try { st = document.queryCommandState(c); } catch (e) {} b.setAttribute("aria-pressed", st); } });
  const blk = blockOf(); $("style").value = blk && /^(H2|H3|H4|BLOCKQUOTE)$/.test(blk.tagName) ? blk.tagName.toLowerCase() : "p";
}
const blockOf = () => { const s = getSelection(); let n = s.anchorNode; while (n && n !== page) { if (n.nodeType === 1 && /^(P|H2|H3|H4|BLOCKQUOTE|LI|DIV|TD|TH)$/.test(n.tagName)) return n; n = n.parentNode; } return null; };
document.querySelector(".tools").addEventListener("mousedown", e => { if (e.target.closest(".tb")) e.preventDefault(); });
document.querySelector(".tools").addEventListener("click", e => {
  const b = e.target.closest("[data-c]"); if (!b) return; const c = b.dataset.c;
  if (c === "link") { const u = prompt("Link (https://…)"); if (u && /^https?:\/\//i.test(u)) exec("createLink", u); return; }
  if (c === "image") return $("imgFile").click();
  if (c === "table") return openTable();
  if (c === "hr") return exec("insertHTML", "<hr><p><br></p>");
  if (c === "find") return openFind();
  exec(c);
});
$("style").onchange = e => { exec("formatBlock", "<" + e.target.value + ">"); };
// font and size: wrap the selected words in a span
function wrapStyle(prop, val) {
  page.focus(); restoreSel(); const s = getSelection(); if (!s.rangeCount || s.isCollapsed) return stat("Select some words first");
  document.execCommand("fontName", false, "__x__");
  page.querySelectorAll('span[style*="__x__"],font[face="__x__"]').forEach(el => { const sp = document.createElement("span"); sp.innerHTML = el.innerHTML; sp.style[prop] = val; el.replaceWith(sp); });
  changed();
}
const FONTS = { Inter: "Inter,sans-serif", Poppins: "Poppins,sans-serif", Hind: "Hind,sans-serif", Merriweather: "Merriweather,serif", Georgia: "Georgia,serif", "Courier New": "'Courier New',monospace" };
$("font").onchange = e => { if (e.target.value) wrapStyle("fontFamily", FONTS[e.target.value]); e.target.value = ""; };
$("size").onchange = e => { if (e.target.value) wrapStyle("fontSize", e.target.value + "px"); e.target.value = ""; };
$("fc").oninput = e => { $("fcS").style.setProperty("--c", e.target.value); }; $("fc").onchange = e => exec("foreColor", e.target.value);
$("hc").oninput = e => { $("hcS").style.setProperty("--c", e.target.value); }; $("hc").onchange = e => exec("hiliteColor", e.target.value);
$("box").onchange = e => { const v = e.target.value; e.target.value = ""; if (!v) return;
  const t = { info: "ℹ Note", trick: "💡 Memory trick", imp: "⚠ Important", exam: "🎯 Asked in exam" }[v];
  exec("insertHTML", `<div class="callout ${v}"><p><b>${t}:</b> type here</p></div><p><br></p>`); };

// pictures (made smaller, saved to the website)
$("imgFile").onchange = async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  try { stat("Adding picture…");
    const img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => no(new Error("That file isn't a picture.")); i.src = URL.createObjectURL(f); });
    const r = Math.min(1, 1400 / Math.max(img.naturalWidth, img.naturalHeight)), c = document.createElement("canvas");
    c.width = Math.round(img.naturalWidth * r); c.height = Math.round(img.naturalHeight * r); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    const png = /png|gif|webp/.test(f.type), data = c.toDataURL(png ? "image/png" : "image/jpeg", 0.88), path = `assets/uploads/doc-${Date.now().toString(36)}.${png ? "png" : "jpg"}`;
    exec("insertHTML", `<p style="text-align:center"><img src="${data}" data-path="${path}" alt="" style="width:75%"></p>`);
    await write(path, data.split(",")[1], "Admin: notes picture"); stat("Picture saved");
  } catch (er) { stat("Could not add picture: " + er.message); }
};
// picture tools
let curImg = null;
page.addEventListener("click", e => { page.querySelectorAll("img.sel").forEach(i => i.classList.remove("sel")); curImg = e.target.tagName === "IMG" ? e.target : null; if (curImg) curImg.classList.add("sel"); ctx(); });
$("imgBar").addEventListener("click", e => { const b = e.target.closest("[data-i]"); if (!b || !curImg) return; const v = b.dataset.i, p = curImg.closest("p") || curImg.parentNode;
  if (/^\d+$/.test(v)) curImg.style.width = v + "%"; else if (v === "del") { curImg.remove(); curImg = null; } else p.style.textAlign = v;
  changed(); ctx(); });
// tables
function openTable() {
  $("tpick").innerHTML = Array.from({ length: 64 }, (_, i) => `<i data-r="${Math.floor(i / 8) + 1}" data-c="${i % 8 + 1}"></i>`).join(""); $("tblDlg").showModal(); }
$("tpick").addEventListener("mouseover", e => { const t = e.target.closest("i"); if (!t) return; const r = +t.dataset.r, c = +t.dataset.c; $("tsz").textContent = `${r} × ${c}`;
  $("tpick").querySelectorAll("i").forEach(x => x.classList.toggle("on", +x.dataset.r <= r && +x.dataset.c <= c)); });
$("tpick").addEventListener("click", e => { const t = e.target.closest("i"); if (!t) return; const r = +t.dataset.r, c = +t.dataset.c; $("tblDlg").close();
  exec("insertHTML", `<table><thead><tr>${"<th>Heading</th>".repeat(c)}</tr></thead><tbody>${`<tr>${"<td><br></td>".repeat(c)}</tr>`.repeat(Math.max(1, r - 1))}</tbody></table><p><br></p>`); });
$("tCancel").onclick = () => $("tblDlg").close();
const cell = () => { const s = getSelection(); let n = s.anchorNode; while (n && n !== page) { if (n.nodeType === 1 && /^(TD|TH)$/.test(n.tagName)) return n; n = n.parentNode; } return null; };
$("tblBar").addEventListener("mousedown", e => e.preventDefault());
$("tblBar").addEventListener("click", e => {
  const b = e.target.closest("[data-t]"); const td = cell(); if (!b || !td) return; const tr = td.parentNode, tbl = td.closest("table"), ci = [...tr.children].indexOf(td), a = b.dataset.t;
  const newRow = () => { const r = document.createElement("tr"); [...tr.children].forEach(() => { const d = document.createElement("td"); d.innerHTML = "<br>"; r.appendChild(d); }); return r; };
  if (a === "rowA") (tr.parentNode.tagName === "THEAD" ? tbl.tBodies[0].prepend(newRow()) : tr.before(newRow()));
  if (a === "rowB") (tr.parentNode.tagName === "THEAD" ? tbl.tBodies[0].prepend(newRow()) : tr.after(newRow()));
  if (a === "colL" || a === "colR") tbl.querySelectorAll("tr").forEach(r => { const ref = r.children[ci]; const d = document.createElement(r.parentNode.tagName === "THEAD" ? "th" : "td"); d.innerHTML = "<br>"; a === "colL" ? ref.before(d) : ref.after(d); });
  if (a === "delRow" && tbl.rows.length > 1) tr.remove();
  if (a === "delCol" && tr.children.length > 1) tbl.querySelectorAll("tr").forEach(r => r.children[ci] && r.children[ci].remove());
  if (a === "head") { if (tbl.tHead) { const r = tbl.tHead.rows[0]; const nr = document.createElement("tr"); [...r.children].forEach(h => { const d = document.createElement("td"); d.innerHTML = h.innerHTML; nr.appendChild(d); }); tbl.tBodies[0].prepend(nr); tbl.tHead.remove(); }
    else { const r = tbl.tBodies[0].rows[0]; const th = tbl.createTHead(), nr = document.createElement("tr"); [...r.children].forEach(d => { const h = document.createElement("th"); h.innerHTML = d.innerHTML; nr.appendChild(h); }); th.appendChild(nr); r.remove(); } }
  if (a === "delTbl") tbl.remove();
  changed(); ctx();
});
function ctx() { $("tblBar").classList.toggle("show", !!cell()); $("imgBar").classList.toggle("show", !!(curImg && curImg.isConnected)); }

// find and replace
const openFind = () => { $("findBar").classList.add("show"); $("fFind").focus(); };
$("fClose").onclick = () => $("findBar").classList.remove("show");
$("fNext").onclick = () => { const t = $("fFind").value; if (!t) return; page.focus(); const ok = window.find && window.find(t, false, false, true); $("fMsg").textContent = ok ? "" : "Not found"; };
$("fOne").onclick = () => { const s = getSelection(); if (!s.isCollapsed && s.toString().toLowerCase() === $("fFind").value.toLowerCase()) exec("insertText", $("fRep").value); $("fNext").click(); };
$("fAll").onclick = () => { const t = $("fFind").value; if (!t) return; let n = 0; const re = new RegExp(t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi");
  const w = document.createTreeWalker(page, NodeFilter.SHOW_TEXT); const list = []; while (w.nextNode()) list.push(w.currentNode);
  list.forEach(nd => { const v = nd.nodeValue.replace(re, () => { n++; return $("fRep").value; }); if (v !== nd.nodeValue) nd.nodeValue = v; }); $("fMsg").textContent = n + " replaced"; changed(); };
document.addEventListener("keydown", e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "h") { e.preventDefault(); openFind(); }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") { e.preventDefault(); $("saveBtn").click(); } });

// paste: keep text formatting, drop anything unsafe
page.addEventListener("paste", e => { const h = e.clipboardData.getData("text/html"); if (!h) return; e.preventDefault(); document.execCommand("insertHTML", false, safe(h)); changed(); });

// word count + autosave on this device
function changed() { dirty = true; stat("Not saved"); const w = (page.innerText.trim().match(/\S+/g) || []).length; $("wc").textContent = `${w} words`;
  clearTimeout(changed.t); changed.t = setTimeout(() => { try { localStorage.setItem(DRAFT(), JSON.stringify({ at: Date.now(), title: $("title").value, html: page.innerHTML })); } catch (e) {} }, 600); }
page.addEventListener("input", changed); $("title").addEventListener("input", changed);
window.addEventListener("beforeunload", e => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });

// Word import
$("importBtn").onclick = () => $("docxFile").click();
$("docxFile").onchange = async e => { const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  try { stat("Reading Word file…");
    if (!window.mammoth) await new Promise((ok, no) => { const s = document.createElement("script"); s.src = "https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js"; s.onload = ok; s.onerror = () => no(new Error("Could not load the Word reader")); document.head.appendChild(s); });
    const r = await mammoth.convertToHtml({ arrayBuffer: await f.arrayBuffer() });
    page.focus(); document.execCommand("insertHTML", false, safe(r.value)); if (!$("title").value) $("title").value = f.name.replace(/\.docx$/i, ""); changed(); stat("Word file added");
  } catch (er) { stat("Could not read the file: " + er.message); } };
$("printBtn").onclick = () => window.print();

// form notes (older style) → document
const esc = s => E(s == null ? "" : s);
function notesToHtml(n) {
  if (n.html) return n.html;
  let h = n.intro ? `<p>${esc(n.intro)}</p>` : "";
  (n.phases || []).forEach(p => { h += `<h2>${esc(p.h)}</h2>`; p.items.forEach(it => { h += `<h3>${esc([it.yr, it.t].filter(Boolean).join(" – "))}</h3>${it.s ? `<p><i>${esc(it.s)}</i></p>` : ""}<ul>${it.pts.map(x => `<li>${esc(x)}</li>`).join("")}</ul>`; }); });
  const hd = (n.tableHead || []).filter(Boolean);
  if (n.table) h += `<h2>${esc(n.tableTitle || "Important facts")}</h2><table><thead><tr>${hd.map(x => `<th>${esc(x)}</th>`).join("")}</tr></thead><tbody>${n.table.map(r => `<tr>${r.slice(0, hd.length).map(c => `<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
  if ((n.tricks || []).length) h += `<div class="callout trick"><p><b>💡 Memory tricks:</b></p><ul>${n.tricks.map(t => `<li>${esc(t)}</li>`).join("")}</ul></div>`;
  return h;
}

// ---------- open ----------
async function open() {
  stat("Loading…");
  try { [NOTES, SUBS] = await Promise.all([readData("data/notes.js", "NOTES", {}), readData("data/subjects.js", "SUBJECTS", [])]); }
  catch (e) { stat(""); alert(/401|403/.test(e.message) ? "Please log in on the admin login page." : "Could not load: " + e.message); }
  const n = cid && NOTES[cid];
  let draft = null; if (cid) { try { draft = await readRaw(`data/docs/${cid}.html`); } catch (e) {} }
  if (n) { $("title").value = n.title || ""; page.innerHTML = safe(notesToHtml(n)); }
  if (draft) { page.innerHTML = safe(draft); if (!$("title").value) $("title").value = cid.replace(/-/g, " "); }
  try { const d = JSON.parse(localStorage.getItem(DRAFT()) || "null"); if (d && d.html !== page.innerHTML) { $("restore").classList.add("show");
    $("restoreYes").onclick = () => { page.innerHTML = safe(d.html); $("title").value = d.title || $("title").value; $("restore").classList.remove("show"); changed(); };
    $("restoreNo").onclick = () => { localStorage.removeItem(DRAFT()); $("restore").classList.remove("show"); }; } } catch (e) {}
  changed(); dirty = false; stat(draft ? "Draft (not published yet)" : n ? "Published version" : "New – not saved");
}
// final HTML: pictures point to their saved files instead of the copy kept in memory
const finalHtml = () => { const d = document.createElement("div"); d.innerHTML = safe(page.innerHTML); d.querySelectorAll("img[data-path]").forEach(i => { i.setAttribute("src", i.dataset.path); i.removeAttribute("data-path"); }); return d.innerHTML; };
$("saveBtn").onclick = async () => {
  // drafts are kept in data/docs/<chapter>.html until published
  try { stat("Saving…"); const id = cid || slug($("title").value || "untitled");
    await write(`data/docs/${id}.html`, b64(new TextEncoder().encode(finalHtml())), "Admin: notes draft " + id);
    if (!cid) { cid = id; history.replaceState(null, "", "docs-editor.html?ch=" + id); }
    try { localStorage.removeItem("ssc-doc-draft:new"); localStorage.removeItem(DRAFT()); } catch (e) {}
    dirty = false; stat("Draft saved ✓ (students don't see drafts)");
  } catch (er) { stat("Not saved"); alert("Could not save: " + er.message); }
};

// ---------- publish ----------
$("pubBtn").onclick = () => {
  const n = NOTES[cid] || {};
  $("pSub").innerHTML = SUBS.map(s => `<option value="${E(s.id)}"${s.chapters.some(c => c.id === cid) ? " selected" : ""}>${E(s.name)}</option>`).join("");
  fillCh(); $("pRead").value = n.read || ""; $("pExams").value = (n.exams || []).join(", "); $("pPdf").checked = !!n.pdf; $("pMsg").textContent = ""; $("pubDlg").showModal();
};
function fillCh() { const s = SUBS.find(x => x.id === $("pSub").value); if (!s) return;
  $("pChap").innerHTML = s.chapters.map((c, i) => `<option value="${E(c.id)}"${c.id === cid ? " selected" : ""}>${i + 1}. ${E(c.title)}${NOTES[c.id] ? " (has notes)" : ""}</option>`).join("") + `<option value="__new"${s.chapters.some(c => c.id === cid) ? "" : " selected"}>+ New chapter</option>`;
  newCh(); }
const newCh = () => { const nw = $("pChap").value === "__new"; $("pNewWrap").hidden = !nw; if (nw && !$("pNew").value) $("pNew").value = $("title").value;
  const s = SUBS.find(x => x.id === $("pSub").value), c = s && s.chapters.find(x => x.id === $("pChap").value); $("pDesc").value = c ? c.sub || "" : ""; };
$("pSub").onchange = fillCh; $("pChap").onchange = newCh; $("pCancel").onclick = () => $("pubDlg").close();
$("pGo").onclick = async () => {
  const s = SUBS.find(x => x.id === $("pSub").value); if (!s) return;
  let id = $("pChap").value, title = $("title").value.trim();
  if (id === "__new") { const t = $("pNew").value.trim(); if (!t) return $("pMsg").textContent = "Type the chapter title."; title = title || t;
    const same = s.chapters.find(c => !NOTES[c.id] && (c.id === slug(t) || c.title.toLowerCase() === t.toLowerCase())); // reuse a "coming soon" chapter
    if (same) id = same.id; else { id = slug(t); const all = SUBS.flatMap(x => x.chapters.map(c => c.id)); let k = 2; const base = id; while (all.includes(id)) id = base + "-" + k++; s.chapters.push({ id, title: t, sub: "" }); } }
  const c = s.chapters.find(x => x.id === id); title = title || c.title; c.title = title; c.sub = $("pDesc").value.trim(); c.ready = true;
  if (!page.innerText.trim() && !page.querySelector("img,table")) return $("pMsg").textContent = "The document is empty.";
  const old = NOTES[id] || {};
  const n = { subject: s.id, title, read: $("pRead").value.trim() || "10 min read", exams: $("pExams").value.split(",").map(x => x.trim()).filter(Boolean), intro: "", html: finalHtml() };
  if (old.deck) n.deck = old.deck; if (old.quiz) n.quiz = old.quiz; if ($("pPdf").checked) n.pdf = true; if (old.publishAt) n.publishAt = old.publishAt;
  NOTES[id] = n;
  try { $("pGo").disabled = true; $("pMsg").textContent = "Publishing… (1 of 2)"; await writeData("data/notes.js", "NOTES", NOTES, "All notes content.");
    $("pMsg").textContent = "Publishing… (2 of 2)"; await writeData("data/subjects.js", "SUBJECTS", SUBS, "Subjects and chapters. ready: true shows a chapter on the site.");
    // the draft copy is no longer needed
    for (const d of new Set([cid, id].filter(Boolean))) { try { const sh = (await (await gh(`/contents/data/docs/${d}.html?ref=main&meta=1`)).json()).sha;
      await gh(`/contents/data/docs/${d}.html`, { method: "DELETE", body: JSON.stringify({ message: "Admin: draft published", sha: sh, branch: "main" }), headers: { "Content-Type": "application/json" } }); } catch (e) {} }
    if (cid !== id) { cid = id; history.replaceState(null, "", "docs-editor.html?ch=" + id); }
    try { localStorage.removeItem(DRAFT()); localStorage.removeItem("ssc-doc-draft:new"); } catch (e) {}
    dirty = false; stat("Published ✓"); $("pMsg").textContent = `Published! Live in about a minute at note.html?id=${id}`; setTimeout(() => $("pubDlg").close(), 1600);
  } catch (er) { $("pMsg").textContent = "Could not publish: " + er.message; }
  $("pGo").disabled = false;
};
open();
})();
</script>
